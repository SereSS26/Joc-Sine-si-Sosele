:root{
  --ink:#22262D; --ink2:#3A3F48; --muted:#6A7068; --panel:#F7F8F4; --panel2:#ECEEE7;
  --line:#D3D7CD; --fog:#CFD4C8; --accent:#E8604C; --good:#2FA38D;
  --shadow:0 10px 30px rgba(34,38,45,.16), 0 2px 6px rgba(34,38,45,.08);
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --ui:Barlow, "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{margin:0;background:var(--fog);color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none;}
#app{position:fixed;inset:0;}
#cvs,#cv{position:absolute;inset:0;display:block;width:100%;height:100%;}
#cv{touch-action:none;}
button{font-family:inherit;color:inherit;font-size:inherit;}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

/* ---------- HUD ---------- */
#hudTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;pointer-events:none;}
#hudTop > *{pointer-events:auto;}
.city{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;}
.weekRow{display:flex;align-items:center;gap:8px;margin-top:5px;font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
.weekBar{width:96px;height:5px;border-radius:3px;background:rgba(34,38,45,.12);overflow:hidden;}
.weekBar i{display:block;height:100%;width:0;background:var(--ink);border-radius:3px;}
.scoreBox{display:flex;flex-direction:column;align-items:center;}
.scoreBox b{font-family:var(--display);font-size:46px;font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;}
.scoreBox span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.hudRight{display:flex;gap:8px;justify-content:flex-end;}
.speed{display:flex;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:4px;gap:2px;}
.speed button{width:40px;height:34px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;}
.speed button:hover{background:var(--panel2);}
.speed button.on{background:var(--ink);color:#fff;}
.speed svg{height:14px;}
.round{width:42px;height:42px;border:0;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;}
.round:hover{background:#fff;}
.round svg{width:18px;height:18px;}

#toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;gap:4px;padding:6px;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);white-space:nowrap;}
.tool{position:relative;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 12px 8px 9px;border-radius:14px;cursor:pointer;font-weight:600;font-size:14px;}
.tool:hover{background:var(--panel2);}
.tool.on{background:var(--ink);color:#fff;}
.tool svg{width:24px;height:24px;flex:none;}
.tool .cnt{font-variant-numeric:tabular-nums;font-weight:700;min-width:18px;text-align:right;opacity:.9;}
.tool kbd{position:absolute;top:3px;right:4px;font-family:inherit;font-size:9px;font-weight:700;opacity:.45;}
.sep{width:1px;height:30px;background:var(--line);margin:0 6px;}
.stat{display:flex;align-items:center;gap:6px;padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;}
.stat svg{width:24px;height:24px;}
.stat small{font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.flash{animation:flash .4s ease 2;}
@keyframes flash{50%{background:var(--accent);color:#fff;}}

#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:15px;line-height:1.35;max-width:min(560px,calc(100% - 32px));text-align:center;box-shadow:var(--shadow);transition:opacity .25s,transform .25s;opacity:0;pointer-events:none;}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(207,212,200,.62);}
.screen.clear{background:transparent;}
.card{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:30px;width:100%;max-width:480px;max-height:calc(100% - 32px);overflow:auto;}
.tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
h2{font-family:var(--display);font-size:42px;font-weight:900;line-height:.95;margin:0 0 10px;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;}
.card p{margin:0 0 16px;line-height:1.45;color:#454A52;font-size:15px;}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:17px;padding:14px 18px;border-radius:14px;cursor:pointer;letter-spacing:.02em;}
.btn:hover{background:var(--ink2);}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink);}
.stack{display:grid;gap:10px;}

/* main menu */
#scrMain{justify-content:flex-start;background:linear-gradient(90deg,rgba(207,212,200,.92) 0,rgba(207,212,200,.55) 420px,rgba(207,212,200,0) 720px);padding:0;}
.mainPanel{display:flex;flex-direction:column;justify-content:center;gap:28px;height:100%;padding:0 clamp(24px,6vw,80px);max-width:440px;box-sizing:border-box;}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(64px,9vw,104px);line-height:.82;letter-spacing:.01em;margin:0;text-transform:uppercase;}
.logo span{display:block;color:var(--accent);}
.tagline{font-size:17px;font-weight:600;color:#454A52;margin:-10px 0 0;}
.mainPanel .stack{max-width:300px;}
.mainPanel .btn.ghost{background:rgba(247,248,244,.9);box-shadow:inset 0 0 0 2px rgba(34,38,45,.12);}
.mainPanel .btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink);}
.ver{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;}

/* cities */
.wide{max-width:900px;}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:18px 0 20px;}
.cityCard{border:0;background:#fff;border-radius:16px;padding:0;cursor:pointer;text-align:left;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;}
.cityCard:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--ink);}
.cityCard:disabled{cursor:not-allowed;}
.cityCard canvas{width:100%;aspect-ratio:8/5;display:block;}
.cityCard .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;}
.cityCard b{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;line-height:1;}
.cityCard span{font-size:12px;font-weight:600;color:var(--muted);}
.cityCard:disabled canvas{filter:grayscale(1) opacity(.45);}
.lockTag{display:inline-flex;align-items:center;gap:4px;}

/* settings */
.setRow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;}
.setRow:last-of-type{border-bottom:0;margin-bottom:12px;}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px;}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;}
.seg button.on{background:var(--ink);color:#fff;}
input[type=range]{width:160px;accent-color:var(--ink);}

/* how */
.how{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:14px;}
.how li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;}
.how svg{width:44px;height:44px;}
.how b{display:block;margin-bottom:2px;}
.how span{font-size:14px;line-height:1.45;color:#454A52;}
.keys{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px;}

/* week choices */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px;}
#scrWeek .card{max-width:780px;}
.choice small{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:auto;}
.stat.click{cursor:pointer;border-radius:12px;padding:6px 8px;}
.stat.click:hover{background:var(--panel2);}
/* panou depozit */
.dpanel{position:absolute;z-index:4;width:260px;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 16px;}
.dpHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.dpHead b{font-family:var(--display);font-size:26px;font-weight:900;text-transform:uppercase;line-height:1;}
.dpHead button{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;}
.dpHead button:hover{background:var(--panel2);}
.dpRow{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:6px 0;font-weight:600;}
.dpRow svg{width:24px;height:24px;}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper button{width:32px;height:32px;border:0;border-radius:10px;background:var(--panel2);font-weight:800;font-size:18px;line-height:1;cursor:pointer;}
.stepper button:hover:not(:disabled){background:var(--ink);color:#fff;}
.stepper button:disabled{opacity:.3;cursor:default;}
.stepper b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px;}
.dpSub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 7px;}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{width:32px;height:32px;border-radius:10px;border:0;cursor:pointer;position:relative;}
.chip.off{opacity:.22;}
.chip:not(.off)::after{content:"";position:absolute;inset:9px;border-radius:50%;background:rgba(255,255,255,.9);}
.dpFree{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px;}
.dpNote{font-size:12px;color:#A2432F;font-weight:700;margin-top:8px;line-height:1.35;}
.choice{border:0;background:#fff;border-radius:18px;padding:20px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 2px var(--line);}
.choice:hover{box-shadow:inset 0 0 0 2px var(--ink);transform:translateY(-1px);}
.choice svg{width:40px;height:40px;}
.choice b{font-size:18px;}
.choice span{font-size:13px;color:var(--muted);line-height:1.35;}

.stats{display:flex;gap:26px;margin:6px 0 20px;flex-wrap:wrap;}
.stats div{display:flex;flex-direction:column;}
.stats b{font-family:var(--display);font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.stats span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.unlock{background:#E3F2EE;color:#1F6F60;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:16px;}

@media (max-width:1380px){ .tool .lbl,.stat small{display:none;} .tool{padding:8px 10px;} }
@media (max-width:760px){ .choices{grid-template-columns:1fr 1fr;} }
@media (max-width:640px){
  .city{font-size:22px;} .scoreBox b{font-size:34px;} .speed button{width:32px;}
  #hudTop{grid-template-columns:auto 1fr auto;}
  .choices{grid-template-columns:1fr;}
  #scrMain{background:rgba(207,212,200,.85);}
}
/* ---------- telefon ---------- */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
button,.tool,.stat,.choice,.cityCard{touch-action:manipulation;}
.speed .spCycle{display:none;font-weight:800;font-size:13px;}
.touchOnly{display:none;}
body.touch .touchOnly{display:block;}
#btnFit{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);}
@media (max-width:760px), (max-height:520px){
  #hudTop{top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));gap:6px;}

  .scoreBox b{font-size:30px;} .scoreBox span{font-size:9px;letter-spacing:.1em;}
  .hudRight{gap:6px;}
  .speed{padding:3px;border-radius:12px;} .speed button{width:36px;height:36px;}
  .speed button[data-sp="1"],.speed button[data-sp="2"],.speed button[data-sp="3"]{display:none;}
  .speed .spCycle{display:grid;}
  .round{width:42px;height:42px;border-radius:12px;}
  #toolbar{left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);overflow-x:auto;overscroll-behavior-x:contain;justify-content:flex-start;padding:5px;gap:2px;border-radius:16px;scrollbar-width:none;}
  #toolbar::-webkit-scrollbar{display:none;}
  .tool{padding:6px 9px;min-height:44px;flex:none;gap:5px;} .tool .lbl,.tool kbd,.stat small{display:none;}
  .tool svg{width:24px;height:24px;} .tool .cnt{min-width:12px;font-size:13px;}
  .stat{flex:none;padding:0 6px;font-size:13px;gap:4px;} .stat.click{padding:6px;} .sep{margin:0 3px;flex:none;}
  #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 72px);font-size:13px;padding:9px 12px;max-width:calc(100% - 24px);}
  .dpanel{left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);max-height:60%;overflow:auto;box-sizing:border-box;}
  .stepper button{width:40px;height:40px;} .chip{width:38px;height:38px;}
  #btnFit{bottom:calc(env(safe-area-inset-bottom,0px) + 72px);right:calc(8px + env(safe-area-inset-right,0px));}
  .screen{padding:10px;}
  .card{padding:20px;border-radius:20px;max-height:calc(100% - 20px);}
  h2{font-size:32px;}
  .cities{grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 14px;}
  .choices{grid-template-columns:repeat(2,1fr);gap:8px;}
  .choice{padding:12px;gap:4px;} .choice svg{width:28px;height:28px;} .choice b{font-size:15px;} .choice span{font-size:12px;}
  .stats{gap:18px;} .stats b{font-size:36px;}
  #scrMain{background:rgba(207,212,200,.8);}
  .mainPanel{padding:0 24px;gap:16px;max-width:none;}
  .mainPanel .stack{max-width:340px;}
}
@media (max-height:520px){
  #hudTop{top:calc(env(safe-area-inset-top,0px) + 6px);}
  .city{font-size:18px;} .scoreBox b{font-size:26px;}
  .round{width:38px;height:38px;} .speed button{width:32px;height:32px;}
  .tool{min-height:40px;padding:5px 8px;} #toolbar{bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding:4px;}
  #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 50px);font-size:12px;max-width:60%;}
  .dpanel{left:auto;width:290px;top:calc(env(safe-area-inset-top,0px) + 50px);bottom:auto;max-height:calc(100% - 60px);}
  #btnFit{bottom:calc(env(safe-area-inset-bottom,0px) + 60px);}
  .logo{font-size:52px;} .tagline{font-size:14px;margin-top:-6px;}
  .mainPanel{gap:12px;} .btn{padding:10px 14px;font-size:15px;}
  .mainPanel{flex-direction:column;justify-content:center;}
}
@media (max-height:520px) and (orientation:landscape){
  #toolbar{left:calc(6px + env(safe-area-inset-left,0px));right:auto;top:calc(env(safe-area-inset-top,0px) + 50px);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);flex-direction:column;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;width:auto;align-items:stretch;}
  .tool{min-height:38px;padding:4px 7px;justify-content:space-between;} .sep{width:auto;height:1px;margin:3px 2px;}
  .stat{padding:4px 7px;justify-content:space-between;}
  #toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:calc(50% + 40px);max-width:52%;}
  #btnFit{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none;}#toast{transition:none;}}
</style>

}

function viaCheck(a,b){
  const ax=a%W, ay=(a/W)|0, bx=b%W, by=(b/W)|0, dx=bx-ax, dy=by-ay;
  if(a===b) return {ok:false};
  if(!(dx===0||dy===0||Math.abs(dx)===Math.abs(dy))) return {ok:false,reason:'hViaLine'};
  const len=Math.max(Math.abs(dx),Math.abs(dy));
  if(len<2) return {ok:false,reason:'hViaShort'};
  if(len>VIA_MAX+1) return {ok:false,reason:'hViaLong'};
  for(const t of [a,b]) if(!inBt(t)||water[t]||mount[t]||bmap[t]||railN[t]) return {ok:false,reason:'hViaEnd'};
  const sx=Math.sign(dx), sy=Math.sign(dy), tiles=[];
  for(let k=1;k<len;k++){ const t=idx(ax+sx*k,ay+sy*k); if(bmap[t]) return {ok:false,reason:'hViaBld'}; tiles.push(t); }
  if(G.vias.some(v=>(v.a===a&&v.b===b)||(v.a===b&&v.b===a))) return {ok:false};
  return {ok:true,len:Math.hypot(dx,dy),tiles};
}

function eraseTile(t){

const HN=new Int32Array(N*9), HP=new Float32Array(N*9); let hs=0, popP=0;
function hpush(n,p){let i=hs++;while(i>0){const q=(i-1)>>1;if(HP[q]<=p)break;HN[i]=HN[q];HP[i]=HP[q];i=q;}HN[i]=n;HP[i]=p;}
function hpop(){const n=HN[0];popP=HP[0];const ln=HN[--hs],lp=HP[hs];let i=0;for(;;){let c=2*i+1;if(c>=hs)break;if(c+1<hs&&HP[c+1]<HP[c])c++;if(HP[c]>=lp)break;HN[i]=HN[c];HP[i]=HP[c];i=c;}if(hs>0){HN[i]=ln;HP[i]=lp;}return n;}
const srcMark=new Uint8Array(N);
function dijkstra(sources,E,NN,dist,prev,stopAt){
  dist.fill(Infinity);prev.fill(-1);hs=0;
  for(const s of sources){dist[s]=0;srcMark[s]=1;hpush(s,0);}
  let found=-1;
  while(hs>0){
    const t=hpop(),d=popP;
    if(d>dist[t]) continue;
    if(t===stopAt){found=t;break;}
    if(!NN[t]&&!srcMark[t]) continue;
    const m=E[t];
    if(m) for(let k=0;k<8;k++){ if(!(m&(1<<k))) continue; const n=t+DOFF[k], nd=d+DLEN[k]; if(nd<dist[n]){dist[n]=nd;prev[n]=t;hpush(n,nd);} }
    if(E===roadE){ const J=JUMPS.get(t); if(J) for(const j of J){ const nd=d+j.len; if(nd<dist[j.n]){dist[j.n]=nd;prev[j.n]=t;hpush(j.n,nd);} } }
  }
  for(const s of sources) srcMark[s]=0;
  return found;
}
function trace(prev,from){const p=[];let k=from;while(k!==-1){p.push(k);k=prev[k];}return p;}
const tmpDist=new Float32Array(N), tmpPrev=new Int32Array(N);
function shopRoad(s){if(s.rc.ver!==G.roadVer){dijkstra(s.cells,roadE,roadN,s.rc.dist,s.rc.prev,-1);s.rc.ver=G.roadVer;}return s.rc;}
function depotRail(d){if(d.rc.ver!==G.railVer){dijkstra(d.cells,railE,railN,d.rc.dist,d.rc.prev,-1);d.rc.ver=G.railVer;}return d.rc;}
function depotRoad(d){if(d.rrc.ver!==G.roadVer){dijkstra(d.cells,roadE,roadN,d.rrc.dist,d.rrc.prev,-1);d.rrc.ver=G.roadVer;}return d.rrc;}

function addHouse(x,y,color,d){

function tryHouse(color,nearShop){
  const same=G.houses.filter(h=>h.color===color);
  const shops=nearShop?[nearShop]:G.shops.filter(s=>s.color===color);
  const b=G.bounds;
  for(let a=0;a<160;a++){
    let x,y;
    if(!nearShop&&same.length&&Math.random()<.7&&a<100){const h=pick(same);x=h.x+ri(-2,2);y=h.y+ri(-2,2);}
    else if(shops.length&&a<130){const s=pick(shops),ang=rnd(0,6.283),d=rnd(4.5,8.5)+s.level*.5;x=Math.round(s.x+s.w/2-.5+Math.cos(ang)*d);y=Math.round(s.y+s.h/2-.5+Math.sin(ang)*d);}
    else {x=ri(b.x0,b.x1);y=ri(b.y0,b.y1);}
    if(!inB(x,y)) continue;
    const t=idx(x,y);
    if(!tileFree(t)||nearBig(x,y)) continue;
    let tgt=null,td=1e9; for(const s of shops){const dd=Math.hypot(s.x+1-x,s.y+1-y);if(dd<td){td=dd;tgt=s;}}
    if(tgt&&a<140&&region[t]!==region[tgt.cells[0]]) continue;
    let best=-1,bs=-1e9;

      const nx=x+DX[d],ny=y+DY[d]; if(!inB(nx,ny)) continue;
      const n=idx(nx,ny);

      if(tgt){const vx=tgt.x+1-(x+.5),vy=tgt.y+1-(y+.5),L=Math.hypot(vx,vy)||1;sc_+=(DX[d]*vx+DY[d]*vy)/L;}

// magazinul creste: nivel nou, stoc mai mare, se extinde daca are loc, la nivelul 3 primeste a doua intrare
function growShop(s){
  s.level++; s.max=LV[s.level].max; s.grown=G.time;
  const opts=[];
  for(const d of [0,2,4,6]){
    if(d===s.door.d||d===s.dock.d||(s.door2&&d===s.door2.d)) continue;
    if((d===0||d===4)&&s.w>=3) continue;
    if((d===2||d===6)&&s.h>=3) continue;
    const cells=[];
    if(d===0) for(let y=s.y;y<s.y+s.h;y++) cells.push([s.x+s.w,y]);
    if(d===4) for(let y=s.y;y<s.y+s.h;y++) cells.push([s.x-1,y]);
    if(d===2) for(let x=s.x;x<s.x+s.w;x++) cells.push([x,s.y+s.h]);
    if(d===6) for(let x=s.x;x<s.x+s.w;x++) cells.push([x,s.y-1]);
    if(cells.every(([x,y])=>inB(x,y)&&tileFree(idx(x,y)))) opts.push({d,cells});
  }
  if(opts.length){
    const o=pick(opts);
    for(const [x,y] of o.cells){const t=idx(x,y);bmap[t]=s;clearTree(t);s.cells.push(t);}
    if(o.d===0) s.w++; else if(o.d===4){s.x--;s.w++;} else if(o.d===2) s.h++; else {s.y--;s.h++;}
  }
  if(s.level===3&&!s.door2){
    const cand=[];
    for(const c of s.cells){const x=c%W,y=(c/W)|0;
      for(const d of [0,2,4,6]){const nx=x+DX[d],ny=y+DY[d]; if(!inGrid(nx,ny)||bmap[idx(nx,ny)]===s) continue;
        if(d===s.dock.d||!okDoor(nx,ny,'road')) continue; if(Math.abs(nx-(s.door.cx+DX[s.door.d]))+Math.abs(ny-(s.door.cy+DY[s.door.d]))<2) continue;
        cand.push({c,d,n:idx(nx,ny),pref:d!==s.door.d?1:0});}}
    cand.sort((a,b)=>b.pref-a.pref||Math.random()-.5);
    if(cand.length){const o=cand[0]; if(!roadN[o.n]){roadN[o.n]=1;fixedT[o.n]|=1;} clearTree(o.n); addEdge(roadE,o.c,o.d); s.door2={d:o.d,cx:o.c%W,cy:(o.c/W)|0};}
  }
  bumpVer('road'); bumpVer('rail');
  fx(s.x+s.w/2,s.y-.2,tr('levelFx',{n:s.level}),COLORS[s.color].d);
  sfx('grow'); hint('hGrow',6);
}

// demo / teste: legare automata
function autoRoute(from,goals,kind){
  const prev=new Int32Array(N).fill(-2), q=[from]; prev[from]=-1;
  const NN=kind==='road'?roadN:railN, OTHER=kind==='road'?railN:roadN, OE=kind==='road'?railE:roadE;
  for(let h=0;h<q.length;h++){
    const t=q[h];
    for(let d=0;d<8;d++){
      const x=t%W+DX[d],y=((t/W)|0)+DY[d]; if(!inB(x,y)) continue;
      const n=idx(x,y); if(prev[n]!==-2) continue;
      if(diagBlocked(t,d)) continue;
      if(OE[t]&(1<<d)) continue;
      if(goals.has(n)){prev[n]=t;const p=[];let k=n;while(k!==-1){p.push(k);k=prev[k];}return p.reverse();}
      if(bmap[n]||mount[n]||(fixedT[n]&&!NN[n])) continue;

      prev[n]=t; q.push(n);
    }
  }

}

function demoConnectAll(){

function dispatch(){

  if(c.kind==='truck'){const rc=depotRoad(c.depot);if(rc.dist[a]<Infinity){c.path=trace(rc.prev,a);c.i=0;return true;}return false;}
  if(dijkstra([c.h.t],roadE,roadN,tmpDist,tmpPrev,a)>=0){c.path=trace(tmpPrev,a);c.i=0;return true;}
  return false;

function carBlocked(c){

// --- intersectii
const NO_OCC=[];
function nodeSt(t){let ns=G.nodeState.get(t);if(!ns){ns={phase:-1,t:0,waits:[0,0,0,0],prio:-1};G.nodeState.set(t,ns);}return ns;}
function occAdd(n,c,app){let l=G.occ2.get(n);if(!l){l=parr();G.occ2.set(n,l);}l.push(pocc(c,app,dirTo(n,app)&3));}
function zoneF(n){return ctrl[n]===1?1:ctrl[n]===2?.82:.6;}
function canEnter(c,b,a){
  const occ=G.occ2.get(b)||NO_OCC, k=ctrl[b];
  if(c.xw>6) return true;
  if(k===2){ let n=0; for(const o of occ) if(o.c!==c) n++; return n<3; }
  const ns=nodeSt(b), g=dirTo(b,a)&3;
  if(k===1){

    for(const o of occ) if(o.c!==c&&o.grp!==g) return false;
    return true;
  }

  for(const o of occ) if(o.c!==c&&o.app!==a){ if(c.xw>1.1&&ns.prio===-1) ns.prio=a; return false; }
  if(ns.prio===a) ns.prio=-1;

}
function lightsUpdate(dt){
  for(const [t,ns] of G.nodeState){
    if(ctrl[t]!==1) continue;
    const m=roadE[t]; let groups=0;
    for(let d=0;d<8;d++) if((m&(1<<d))&&roadN[t+DOFF[d]]) groups|=1<<(d&3);
    for(const j of (JUMPS.get(t)||NOJ)) groups|=1<<(dirTo(t,j.n)&3);
    if(ns.phase<0||!(groups&(1<<ns.phase))){ for(let g=0;g<4;g++) if(groups&(1<<g)){ns.phase=g;break;} ns.t=2.6; }
    ns.t-=dt;
    if(ns.t<=0){ for(let k=1;k<4;k++){const g=(ns.phase+k)&3; if((groups&(1<<g))&&ns.waits[g]>0){ns.phase=g;ns.t=2.6;break;}} }

function stepCar(c,dt){

  if(c.phase==='park'){
    c.wait-=dt; if(c.wait>0) return;
    if(c.kind==='truck'){
      const rc=depotRoad(c.depot), end=c.path[c.path.length-1];
      if(rc.dist[end]===Infinity){truckHome(c);return;}
      c.path=trace(rc.prev,end);
    } else {
      const rc=shopRoad(c.s);
      if(rc.dist[c.h.t]===Infinity){c.h.home++;c.dead=true;return;}
      c.path=trace(rc.prev,c.h.t).reverse();
    }
    c.i=0; c.t=0; c.phase='back'; c.ghost=false; c.blk=0; c.xw=0;
    c.L=segLen(c.path[0],c.path[1]);
    return;
  }
  const a=c.path[c.i], b=c.path[c.i+1];
  let sp=c.kind==='truck'?TRUCK_SPEED:CAR_SPEED;
  const rem=(1-c.t)*c.L, bInter=isInter(b);
  if(bInter&&rem<RZ) sp*=zoneF(b); else if(c.i>0&&c.t*c.L<RZ&&isInter(a)) sp*=zoneF(a);
  let nt=c.t+sp*dt/c.L;
  if(!c.ghost&&carBlocked(c)){ c.blk+=dt; nt=c.t; if(c.blk>5) c.ghost=true; } else c.blk=0;
  const cap=1-.6/c.L;
  if(c.t<=cap&&carMustStop(b)) nt=Math.min(nt,cap);
  if(bInter&&rem>=RZ-1e-6){
    const sl=1-RZ/c.L;
    if(nt>sl){
      if(canEnter(c,b,a)){ c.xw=0; occAdd(b,c,a); }
      else { nt=Math.max(c.t,sl); c.xw+=dt; }
    }
  }
  c.t=nt;
  if(c.t>=1){
    c.t-=1; c.i++; c.ghost=false; c.blk=0;
    if(c.i>=c.path.length-1){ c.t=0; arriveCar(c); return; }
    if(!edgeOk(c.path[c.i],c.path[c.i+1])){ if(!rerouteCar(c)){cancelCar(c);return;} c.t=0; }
    const nl=segLen(c.path[c.i],c.path[c.i+1]); c.t=c.t*c.L/nl; c.L=nl;
  }

}
const RR=.44;
function carPos(c){
  const a=c.path[c.i], b=c.path[c.i+1];
  const ax=a%W+.5, ay=((a/W)|0)+.5, bx=b%W+.5, by=((b/W)|0)+.5;
  const dx=bx-ax, dy=by-ay, l=Math.hypot(dx,dy)||1;
  let x=ax+dx*c.t-dy/l*.17, y=ay+dy*c.t+dx/l*.17, ta=Math.atan2(dy,dx);
  const rem=(1-c.t)*c.L, done=c.t*c.L;
  let arc=null;
  if(ctrl[b]===2&&rem<RZ&&c.i+2<c.path.length) arc=[b,a,c.path[c.i+2],(RZ-rem)/RZ*.5];
  else if(ctrl[a]===2&&done<RZ&&c.i>0) arc=[a,c.path[c.i-1],b,.5+done/RZ*.5];
  if(arc){
    const [n,p,q,u]=arc, nx=n%W+.5, ny=((n/W)|0)+.5;
    const ti=Math.atan2(((p/W)|0)+.5-ny,p%W+.5-nx), to=Math.atan2(((q/W)|0)+.5-ny,q%W+.5-nx);
    let dl=to-ti; while(dl>=0) dl-=6.2832; while(dl<-6.2832) dl+=6.2832; if(dl>-.01) dl=-6.2832;
    const th=ti+dl*u; x=nx+Math.cos(th)*RR; y=ny+Math.sin(th)*RR; ta=th-Math.PI/2;
  }

}
function arriveCar(c){
  if(c.kind==='truck'){
    if(c.phase==='go'){
      const s=c.s; s.stock=Math.min(s.max,s.stock+c.cargo); s.inGoods-=c.cargo;
      fx(s.x+s.w/2,s.y+s.h+.1,'+'+c.cargo,INK); sfx('goods');
      c.cargo=0; c.phase='park'; c.wait=.6;
    } else { c.phase='idle'; c.cool=.4; c.path=null; if(c.retire){c.dead=true;G.res.truck++;} }
    return;
  }
  if(c.phase==='go'){
    const s=c.s; s.stock--; s.demand--; s.inCars--; s.served++; G.score++;
    fx(s.x+s.w/2,s.y+.1,'+1',COLORS[s.color].d); sfx('deliver',s.color);
    if(s.level<3&&s.served>=LV[s.level+1].need) growShop(s);
    c.phase='park'; c.wait=.6;
  } else { c.h.home++; c.dead=true; }
}
function carNear(n,r2){
  const bx=n%W+.5, by=((n/W)|0)+.5;
  for(const c of G.cars){ if(c.dead||c.phase==='park'||c.phase==='idle'||c.air) continue; const dx=c.x-bx,dy=c.y-by; if(dx*dx+dy*dy<r2) return c; }
  return null;
}

// =====================================================================
//  TRENURI, TRECERI, ACCIDENTE
// =====================================================================
function setPath(tr,p){
  tr.path=p; tr.cum=new Float32Array(p.length); for(let k=1;k<p.length;k++) tr.cum[k]=tr.cum[k-1]+DLEN[dirIdx(p[k-1],p[k])];
  tr.s=0; tr.seg=0;
}
function findJob(d){
  const rc=depotRail(d); let best=null,bd=Infinity;
  for(const s of G.shops){ if(s.stock+s.inGoods>s.max-4||!serves(d,s)) continue; const urg=(s.stock+s.inGoods)/s.max*14; for(const c of s.cells) if(rc.dist[c]+urg<bd){bd=rc.dist[c]+urg;best=c;} }
  return best===null?null:trace(rc.prev,best).reverse();
}
function startJob(tr,p){
  const s=bmap[p[p.length-1]]; tr.shop=s; tr.cargo=TRAIN_CARGO; s.inGoods+=TRAIN_CARGO;
  setPath(tr,p); tr.phase='go'; sfx('horn');
}
function toDepot(tr){ if(tr.phase==='go'&&tr.shop) tr.shop.inGoods-=tr.cargo; tr.cargo=0; tr.phase='idle'; tr.path=null; tr.cool=1; tr.held=-1; if(tr.retire&&!tr.gone){tr.gone=true;G.res.loco++;} }
function rerouteTrain(tr){
  const a=tr.path[tr.seg];
  if(tr.phase==='back'){const rc=depotRail(tr.depot);if(rc.dist[a]<Infinity){setPath(tr,trace(rc.prev,a));return true;}return false;}
  if(dijkstra(tr.shop.cells,railE,railN,tmpDist,tmpPrev,a)>=0){setPath(tr,trace(tmpPrev,a));return true;}
  return false;
}
function trainMustStop(n){
  if(wreck[n]>0) return true;
  return roadN[n]&&railN[n]&&xing[n]===1&&carNear(n,.3)!==null;
}
function stepTrain(tr,dt){
  if(tr.phase==='idle'){ tr.cool-=dt; if(tr.cool<=0){ tr.cool=.8; const p=findJob(tr.depot); if(p) startJob(tr,p); } return; }
  if(tr.phase==='unload'){
    tr.wait-=dt; if(tr.wait>0) return;
    const rc=depotRail(tr.depot), end=tr.path[tr.path.length-1];
    if(rc.dist[end]===Infinity){toDepot(tr);return;}
    setPath(tr,trace(rc.prev,end)); tr.phase='back'; return;
  }
  if(tr.held>=0){ if(wreck[tr.held]>0) return; tr.held=-1; }
  let ns=tr.s+TRAIN_SPEED*dt;
  const k=tr.seg+1;
  if(k<tr.path.length-1){ const dn=tr.cum[k]-tr.s; if(dn>.5&&trainMustStop(tr.path[k])) ns=Math.min(ns,tr.cum[k]-.5); }
  tr.s=Math.max(tr.s,ns);
  while(tr.s>=tr.cum[tr.seg+1]){
    tr.seg++;
    if(tr.seg>=tr.path.length-1){ arriveTrain(tr); return; }
    const a=tr.path[tr.seg], d=dirIdx(a,tr.path[tr.seg+1]);
    if(!(railE[a]&(1<<d))){ if(!rerouteTrain(tr)){toDepot(tr);return;} break; }
  }
}
function arriveTrain(tr){
  if(tr.phase==='go'){
    const s=tr.shop; s.stock=Math.min(s.max,s.stock+tr.cargo); s.inGoods-=tr.cargo;
    fx(s.x+s.w/2,s.y+s.h+.1,'+'+tr.cargo,INK); sfx('goods');
    tr.cargo=0; tr.phase='unload'; tr.wait=.7;
  } else { tr.phase='idle'; tr.path=null; tr.cool=.4; if(tr.retire&&!tr.gone){tr.gone=true;G.res.loco++;} }
}
function trainPos(tr,s){
  const p=tr.path, cum=tr.cum; s=clamp(s,0,cum[cum.length-1]);
  let k=Math.min(tr.seg,p.length-2); while(k>0&&cum[k]>s)k--; while(k<p.length-2&&cum[k+1]<s)k++;
  const a=p[k],b=p[k+1],L=cum[k+1]-cum[k],f=L>0?(s-cum[k])/L:0;
  const ax=a%W+.5,ay=((a/W)|0)+.5,bx=b%W+.5,by=((b/W)|0)+.5;
  return [ax+(bx-ax)*f,ay+(by-ay)*f,Math.atan2(by-ay,bx-ax)];
}
const TRAIN_PARTS=[0,.78,1.5];
function computeLocks(){
  G.lock.clear(); G.occ.clear();
  for(const tr of G.trains){
    if(!tr.path||(tr.phase!=='go'&&tr.phase!=='back')) continue;
    const lo=Math.max(0,tr.seg-3), hi=Math.min(tr.path.length-1,tr.seg+4);
    for(let k=lo;k<=hi;k++){
      const n=tr.path[k]; if(!(roadN[n]&&railN[n])) continue;
      const dn=tr.cum[k]-tr.s;
      if(xing[n]===1&&dn>-1.9&&dn<2.3) G.lock.add(n);
      if(xing[n]===0&&dn>-1.9&&dn<.95) G.occ.add(n);
    }
  }
}
function checkAccidents(){
  for(const tr of G.trains){
    if(!tr.path||(tr.phase!=='go'&&tr.phase!=='back')) continue;
    const lo=Math.max(0,tr.seg-3), hi=Math.min(tr.path.length-1,tr.seg+2);
    for(let k=lo;k<=hi;k++){
      const n=tr.path[k];
      if(!(roadN[n]&&railN[n])||xing[n]!==0||wreck[n]>0) continue;
      for(const off of TRAIN_PARTS){
        const ps=tr.s-off; if(Math.abs(tr.cum[k]-ps)>.6) continue;
        const [px,py]=trainPos(tr,ps);
        for(const c of G.cars){
          if(c.dead||c.phase==='park'||c.phase==='idle'||c.air) continue;
          const dx=c.x-px,dy=c.y-py;
          if(dx*dx+dy*dy<.1){ accident(n,c,tr); return; }
        }
      }
    }
  }
}
function accident(n,c,tr){
  wreck[n]=9; G.wrecks.add(n); G.accidents++;
  if(c.kind==='truck'){ truckHome(c,12); }
  else { if(c.phase==='go') c.s.inCars--; c.dead=true; G.pending.push({t:12,h:c.h}); }
  tr.held=n;
  fx(n%W+.5,((n/W)|0)-.2,tr_('accidentFx'),'#C0392B');
  sfx('crash'); hint('hAccident',6);
}
const tr_=k=>tr(k);

function houseCount(c){let n=0;for(const h of G.houses)if(h.color===c)n++;return n;}
function countHouses(){HC.fill(0);for(const h of G.houses)HC[h.color]++;}
function weekMul(){return Math.min(1.8,1+.05*(G.week-1));}
function step(dt){
  G.time+=dt;
  computeLocks();
  lightsUpdate(dt);
  // cerere
  const demo=G.mode==='demo';
  countHouses();
  let anySupply=G.trains.length>0; if(!anySupply) for(const c of G.cars) if(c.kind==='truck'){anySupply=true;break;}
  for(const s of G.shops){
    const hc=HC[s.color], L=LV[s.level];
    if(hc>0){
      const rate=BASE_DEMAND*L.mul*weekMul()*G.city.diff*Math.min(1,hc/(2+s.level))*(demo?.55:1);
      s.pinAcc+=dt*rate;
      if(s.pinAcc>=1){s.pinAcc-=1;if(s.demand<L.pins)s.demand++;}
    }
    if(s.demand>=L.over) s.timer+=dt/30; else s.timer=Math.max(0,s.timer-dt/12);
    if(s.timer>=1){ if(demo){s.timer=0;s.demand=2;} else {gameOver(s);return;} }
    if(s.stock<=3&&!anySupply) hint('hSupply',9);
  }
  G.dispT-=dt; if(G.dispT<=0){G.dispT=.3;dispatch();}
  // index segmente + ocupare intersectii
  G.segMap.clear(); G.startMap.clear(); G.occ2.clear(); arrI=0; occI=0;
  for(const c of G.cars){
    if(c.dead||c.phase==='park'||c.phase==='idle') continue;
    const a=c.path[c.i], b=c.path[c.i+1], k=a*N+b;
    let l=G.segMap.get(k); if(!l){l=parr();G.segMap.set(k,l);} l.push(c);
    let m=G.startMap.get(a); if(!m){m=parr();G.startMap.set(a,m);} m.push(c);
    if((1-c.t)*c.L<RZ-1e-6&&isInter(b)) occAdd(b,c,a);
    else if(c.i>0&&c.t*c.L<RZ&&isInter(a)) occAdd(a,c,c.path[c.i-1]);
  }
  for(const c of G.cars) if(!c.dead) stepCar(c,dt);
  // vehicule noi
  G.trainT-=dt;
  if(G.trainT<=0&&demo){
    G.trainT=.5;
    for(const d of G.depots){
      if(G.res.loco<=0) break;
      if(G.trains.some(t=>t.depot===d&&t.phase==='idle')) continue;
      const p=findJob(d);
      if(p){ G.res.loco--; const t={id:uid++,depot:d,shop:null,path:null,cum:null,s:0,seg:0,phase:'idle',cargo:0,wait:0,cool:0,held:-1}; G.trains.push(t); startJob(t,p); }
    }
    for(const d of G.depots){
      if(G.res.truck<=0) break;
      if(G.cars.some(c=>c.kind==='truck'&&c.depot===d&&c.phase==='idle')) continue;
      const p=findTruckJob(d);
      if(p){ G.res.truck--; const c=newVehicle('truck'); c.depot=d; G.cars.push(c); startTruck(c,p); }
    }
  }
  if(!demo&&(G.res.loco>0||G.res.truck>0)&&G.time>3) hint('hAssign',8);
  for(const t of G.trains) stepTrain(t,dt);
  if(G.trains.some(t=>t.gone)) G.trains=G.trains.filter(t=>!t.gone);
  checkAccidents();
  if(G.cars.some(c=>c.dead)) G.cars=G.cars.filter(c=>!c.dead);
  // epave & masini pierdute
  for(const t of G.wrecks){ wreck[t]-=dt; if(wreck[t]<=0){ wreck[t]=0; G.wrecks.delete(t); } }
  if(G.pending.length){ for(const p of G.pending){p.t-=dt;if(p.t<=0)p.h.home++;} G.pending=G.pending.filter(p=>p.t>0); }
  // aparitii
  G.houseT-=dt;
  if(G.houseT<=0){
    G.houseT=Math.max(2.6,7-.3*G.week)*rnd(.7,1.3);
    let cap=2; for(const s of G.shops) cap+=3+2*s.level;
    if(demo) cap=Math.min(cap,G.shops.length*5);
    if(G.houses.length<cap) spawnHouse();
  }
  if(!demo){
    G.shopT-=dt; if(G.shopT<=0){G.shopT=Math.max(38,72-2.5*G.week)*rnd(.85,1.15);spawnShop();}
    G.weekT+=dt; if(G.weekT>=WEEK_LEN) endWeek();
  }
}
function spawnHouse(){
  const colors=[...new Set(G.shops.map(s=>s.color))];
  let best=null,bw=-1;
  for(const c of colors){let want=0;for(const s of G.shops)if(s.color===c)want+=3+2*s.level;const w=want/(houseCount(c)+1)*rnd(.6,1.4);if(w>bw){bw=w;best=c;}}
  if(best===null) return;
  const h=tryHouse(best,null);
  if(h){ sfx('spawn'); if(G.mode==='demo') demoConnectAll(); }
}
function spawnShop(){
  let color;
  const canNew=G.colorsUsed<COLORS.length&&G.week>=2;
  if(canNew&&(G.shops.length>=G.colorsUsed*1.5||Math.random()<.45)) color=G.colorsUsed; else color=ri(0,G.colorsUsed-1);
  const s=tryShop(color,null); if(!s) return;
  if(color===G.colorsUsed){G.colorsUsed++;for(let i=0;i<2;i++)tryHouse(color,s);}
  sfx('spawn');
}

function camTarget(){
  const f=camFit();
  if(G.mode!=='play'||G.capsule||!(G.zoom>1)) return f;
  return {cx:f.cx+(G.pan?G.pan.x:0),cy:f.cy+(G.pan?G.pan.y:0),ts:f.ts*G.zoom,oy:f.oy,ox:f.ox};
}
function maxZoom(){ return Math.max(1.5,Math.min(6,62/camFit().ts)); }
function clampPan(){
  if(!G.pan) return; const b=G.bounds, f=camFit();
  G.pan.x=clamp(f.cx+G.pan.x,b.x0,b.x1+1)-f.cx; G.pan.y=clamp(f.cy+G.pan.y,b.y0,b.y1+1)-f.cy;
}
// zoom pastrand punctul (wx,wy) al hartii sub punctul (sx,sy) al ecranului
function setZoomAt(z,sx,sy,wx,wy){
  if(!G||G.mode!=='play') return;
  z=clamp(z,1,maxZoom());
  if(z<=1.02){ G.zoom=1; G.pan=null; Object.assign(cam,camFit()); updateFitBtn(); return; }
  G.zoom=z; const f=camFit(), ts=f.ts*z;
  G.pan={x:wx-(sx-vw/2-f.ox)/ts-f.cx, y:wy-(sy-vh/2-f.oy)/ts-f.cy}; clampPan();
  Object.assign(cam,camTarget()); updateFitBtn();
}
function resetZoom(){ if(!G) return; G.zoom=1; G.pan=null; updateFitBtn(); }
function updateFitBtn(){ const b=$('btnFit'); if(b) b.hidden=!(G&&G.mode==='play'&&G.zoom>1); }
function camFit(){
  const b=G.bounds, bw=b.x1-b.x0+2, bh=b.y1-b.y0+2;
  const compact=vw<=760||vh<=520, short=vh<=520, sideBar=short&&vw>vh;
  const top=sideBar?48:short?44:compact?58:92, bot=sideBar?8:short?52:compact?64:92, side=sideBar?96:compact?8:24;
  if(G.capsule){ const q=G.capsule, ts=Math.max(vw/bw,vh/bh)*q.zoom; return {cx:(b.x0+b.x1+1)/2+q.dx*bw,cy:(b.y0+b.y1+1)/2+q.dy*bh,ts,oy:0,ox:0}; }
  if(G.mode==='demo'){ const ts=Math.min((vw*.9)/bw,(vh*.95)/bh); return {cx:(b.x0+b.x1+1)/2-(vw>900?bw*.18:0),cy:(b.y0+b.y1+1)/2,ts,oy:0,ox:0}; }
  const ts=Math.min((vw-side)/bw,(vh-top-bot)/bh);
  return {cx:(b.x0+b.x1+1)/2,cy:(b.y0+b.y1+1)/2,ts,oy:(top-bot)/2,ox:sideBar?44:0};
}
function fitCam(now){
  const t=camTarget();
  if(now){Object.assign(cam,t);return;}
  const k=.08;
  for(const q of ['cx','cy','ts','oy','ox']){const d=t[q]-cam[q]; cam[q]=Math.abs(d)<.001?t[q]:cam[q]+d*k;}
}
const ox=()=>vw/2+cam.ox-cam.cx*cam.ts, oy=()=>vh/2+cam.oy-cam.cy*cam.ts;
function s2t(sx,sy){return [(sx-ox())/cam.ts,(sy-oy())/cam.ts];}
function t2s(tx,ty){return [tx*cam.ts+ox(),ty*cam.ts+oy()];}
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  vw=window.innerWidth; vh=window.innerHeight;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  sc.width=cv.width; sc.height=cv.height; tc.width=cv.width; tc.height=cv.height;
  if(G) fitCam(true);
  staticKey=''; terrainKey='';
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const pop=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const cxy=t=>[t%W+.5,((t/W)|0)+.5];

function renderTerrain(){
  const c=tctx, ts=cam.ts, city=G.city, b=G.bounds;
  c.setTransform(1,0,0,1,0,0); c.fillStyle=FOG; c.fillRect(0,0,tc.width,tc.height);
  c.setTransform(dpr*ts,0,0,dpr*ts,dpr*ox(),dpr*oy());
  const bw=b.x1-b.x0+1, bh=b.y1-b.y0+1;
  c.fillStyle='rgba(60,66,56,.10)'; rr(c,b.x0+.12,b.y0+.22,bw,bh,.7); c.fill();
  c.fillStyle=city.land; rr(c,b.x0,b.y0,bw,bh,.7); c.fill();
  c.save(); rr(c,b.x0,b.y0,bw,bh,.7); c.clip();
  const x0=Math.max(0,b.x0-1), x1=Math.min(W-1,b.x1+1), y0=Math.max(0,b.y0-1), y1=Math.min(H-1,b.y1+1);
  c.fillStyle=city.mount;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) if(mount[y*W+x]) c.fillRect(x-.02,y-.02,1.04,1.04);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=y*W+x; if(!mount[t]||hash(t)>=.55) continue;
    const px=x+.5+(hash(t+7)-.5)*.3, py=y+.55;
    c.beginPath();c.moveTo(px-.3,py+.22);c.lineTo(px,py-.26);c.lineTo(px+.3,py+.22);c.closePath();c.fillStyle='rgba(120,130,112,.28)';c.fill();
    c.beginPath();c.moveTo(px-.1,py-.08);c.lineTo(px,py-.26);c.lineTo(px+.1,py-.08);c.closePath();c.fillStyle='rgba(255,255,255,.7)';c.fill();}
  c.fillStyle=city.shore; for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) if(water[y*W+x]) c.fillRect(x-.1,y-.1,1.2,1.2);
  c.fillStyle=city.water; for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++) if(water[y*W+x]) c.fillRect(x-.01,y-.01,1.02,1.02);
  c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=.05; c.lineCap='round'; c.beginPath();
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=y*W+x; if(!water[t]||hash(t*3)>=.18) continue; const px=x+.25+hash(t)*.3, py=y+.3+hash(t+1)*.4; c.moveTo(px,py); c.quadraticCurveTo(px+.12,py-.08,px+.24,py); c.quadraticCurveTo(px+.36,py+.08,px+.48,py);}
  c.stroke();
  c.fillStyle='rgba(60,70,50,.13)'; c.beginPath();
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=y*W+x; if(!tree[t]) continue; const n=1+Math.floor(hash(t)*3); for(let i=0;i<n;i++){const px=x+.25+hash(t*7+i)*.5,py=y+.25+hash(t*11+i)*.5,r=.14+hash(t*13+i)*.1; c.moveTo(px+.04+r,py+.06); c.arc(px+.04,py+.06,r,0,6.283);}}
  c.fill();
  c.fillStyle=city.treeC; c.beginPath();
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=y*W+x; if(!tree[t]) continue; const n=1+Math.floor(hash(t)*3); for(let i=0;i<n;i++){const px=x+.25+hash(t*7+i)*.5,py=y+.25+hash(t*11+i)*.5,r=.14+hash(t*13+i)*.1; c.moveTo(px+r,py); c.arc(px,py,r,0,6.283);}}
  c.fill();
  if(SAVE.settings.grid){
    c.fillStyle='rgba(34,38,45,.10)'; c.beginPath();
    for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++){const t=idx(x,y);if(water[t]||mount[t]||tree[t])continue;c.moveTo(x+.545,y+.5);c.arc(x+.5,y+.5,.045,0,6.283);}
    c.fill();
  }
  c.restore();
}
function renderStatic(){
  const b=G.bounds;
  const tk=[cam.cx.toFixed(3),cam.cy.toFixed(3),cam.ts.toFixed(3),cam.oy.toFixed(1),vw,vh,SAVE.settings.grid,G.terrainVer,b.x0,b.x1,b.y0,b.y1,G.ci].join('|');
  if(tk!==terrainKey){ renderTerrain(); terrainKey=tk; }
  const c=sctx, ts=cam.ts, city=G.city;
  c.setTransform(1,0,0,1,0,0); c.drawImage(tc,0,0);
  c.setTransform(dpr*ts,0,0,dpr*ts,dpr*ox(),dpr*oy());
  const segs=(E,filter)=>{const out=[];for(let t=0;t<N;t++){const m=E[t];if(!m)continue;for(let d=0;d<4;d++)if(m&(1<<d)){const n=t+DOFF[d];if(!filter||filter(t,n))out.push(t,n);}}return out;};
  const strokeSegs=(sg,w,col)=>{c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();for(let i=0;i<sg.length;i+=2){const a=sg[i],b2=sg[i+1];c.moveTo(a%W+.5,((a/W)|0)+.5);c.lineTo(b2%W+.5,((b2/W)|0)+.5);}c.stroke();};
  const dots=(NN,r,col,filter)=>{c.fillStyle=col;c.beginPath();for(let t=0;t<N;t++)if(NN[t]&&(!filter||filter(t))){const x=t%W+.5,y=((t/W)|0)+.5;c.moveTo(x+r,y);c.arc(x,y,r,0,6.283);}c.fill();};
  const roadS=segs(roadE), railS=segs(railE);
  const wet=(a,b2)=>water[a]||water[b2];
  // poduri
  strokeSegs(segs(roadE,wet),.86,DECK); strokeSegs(segs(railE,wet),.56,DECK);
  dots(roadN,.43,DECK,t=>water[t]); dots(railN,.28,DECK,t=>water[t]&&!roadN[t]);
  // drumuri + sensuri giratorii
  const rounds=[]; for(let t=0;t<N;t++) if(ctrl[t]===2) rounds.push(cxy(t));
  const discs=(r,col)=>{c.fillStyle=col;c.beginPath();for(const [x,y] of rounds){c.moveTo(x+r,y);c.arc(x,y,r,0,6.283);}c.fill();};
  strokeSegs(roadS,.7,city.edge); dots(roadN,.35,city.edge); discs(.76,city.edge);
  strokeSegs(roadS,.56,ROAD); dots(roadN,.28,ROAD); discs(.68,ROAD);
  discs(.25,city.edge); discs(.22,ISLAND);
  c.fillStyle='rgba(255,255,255,.5)'; c.beginPath(); for(const [x,y] of rounds){c.moveTo(x+.07,y-.04);c.arc(x-.02,y-.04,.07,0,6.283);} c.fill();
  // sine
  c.strokeStyle=TIE; c.lineWidth=.06; c.lineCap='butt'; c.beginPath();
  const tieSeg=(ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),nx=-dy/L*.2,ny=dx/L*.2,n=Math.max(1,Math.round(L*4));for(let i=0;i<n;i++){const f=(i+.5)/n,px=ax+dx*f,py=ay+dy*f;c.moveTo(px-nx,py-ny);c.lineTo(px+nx,py+ny);}};
  for(let i=0;i<railS.length;i+=2){const a=railS[i],b2=railS[i+1];tieSeg(a%W+.5,((a/W)|0)+.5,b2%W+.5,((b2/W)|0)+.5);}
  for(let t=0;t<N;t++) if(railN[t]&&!railE[t]){const x=t%W+.5,y=((t/W)|0)+.5;tieSeg(x-.3,y,x+.3,y);}
  c.stroke();
  strokeSegs(railS,.13,RAIL);
  dots(railN,.065,RAIL);
  // pasaje
  for(const t of crossList()){
    if(xing[t]!==2) continue;
    const x=t%W+.5, y=((t/W)|0)+.5;
    const half=[];for(let d=0;d<8;d++)if(roadE[t]&(1<<d))half.push([x+DX[d]*.5,y+DY[d]*.5]);
    const draw=(w,col,r)=>{c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();for(const [px,py] of half){c.moveTo(x,y);c.lineTo(px,py);}c.stroke();c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();};
    c.fillStyle='rgba(40,44,40,.18)'; c.beginPath(); c.arc(x+.06,y+.1,.46,0,6.283); c.fill();
    draw(.84,DECK,.42); draw(.56,ROAD,.28);
  }
  // pasaje lungi
  for(const v of G.vias){
    const ax=v.a%W+.5, ay=((v.a/W)|0)+.5, bx=v.b%W+.5, by=((v.b/W)|0)+.5;
    c.fillStyle='rgba(58,64,70,.55)';
    for(const t of v.tiles){ const x=t%W+.5, y=((t/W)|0)+.5; c.beginPath(); c.arc(x+.06,y+.1,.13,0,6.283); c.fill(); }
    c.lineCap='round';
    c.strokeStyle='rgba(40,44,40,.2)'; c.lineWidth=.92; c.beginPath(); c.moveTo(ax+.1,ay+.16); c.lineTo(bx+.1,by+.16); c.stroke();
    c.strokeStyle=DECK; c.lineWidth=.84; c.beginPath(); c.moveTo(ax,ay); c.lineTo(bx,by); c.stroke();
    c.strokeStyle=ROAD; c.lineWidth=.56; c.beginPath(); c.moveTo(ax,ay); c.lineTo(bx,by); c.stroke();
  }
  // cladiri care nu se mai misca: depozite si case
  for(const d of G.depots) if(d.inStatic){ shadowRect(c,d,1); drawDepotBody(c,d,1); }
  for(const h of G.houses) if(h.inStatic){ houseShadow(c,h,1); drawHouse(c,h,1); }
}

function render(rdt){
  const key=[cam.cx.toFixed(3),cam.cy.toFixed(3),cam.ts.toFixed(3),cam.oy.toFixed(1),vw,vh,SAVE.settings.grid].join('|');
  if(G.staticDirty||key!==staticKey){renderStatic();staticKey=key;G.staticDirty=false;}
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const ts=cam.ts; VB=dpr*ts; VX=dpr*ox(); VY=dpr*oy();
  ctx.setTransform(VB,0,0,VB,VX,VY);
  drawCrossings(rdt);
  let promote=false;
  for(const d of G.depots){
    if(!d.inStatic){ const k=pop((G.time-d.born)*2.5); shadowRect(ctx,d,k); drawDepotBody(ctx,d,k); if(G.time-d.born>.5){d.inStatic=true;promote=true;} }
    drawDepotExtras(d);
  }
  for(const s of G.shops) shadowRect(ctx,s,pop((G.time-s.born)*2.5));
  for(const h of G.houses){
    if(h.inStatic) continue;
    const k=pop((G.time-h.born)*3); houseShadow(ctx,h,k); drawHouse(ctx,h,k);
    if(G.time-h.born>.45){h.inStatic=true;promote=true;}
  }
  if(promote) G.staticDirty=true;
  for(const s of G.shops) drawShop(s);
  drawLights();
  for(const c of G.cars) if(c.phase!=='park'&&c.phase!=='idle'&&!c.dead) drawCar(c);
  for(const t of G.trains) if(t.path&&(t.phase==='go'||t.phase==='back')) drawTrain(t);
  ctx.setTransform(VB,0,0,VB,VX,VY);
  drawWrecks();
  drawCursor();
  // fx in spatiul ecranului
  if(G.fx.length){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const fs=Math.round(clamp(ts*.62,13,22));
    ctx.font='700 '+fs+'px Barlow, "Segoe UI", sans-serif'; ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.85)';
    for(const f of G.fx){
      const [sx,sy]=t2s(f.x,f.y-f.t*.8);
      ctx.globalAlpha=1-f.t*f.t;
      ctx.strokeText(f.text,sx,sy); ctx.fillStyle=f.color; ctx.fillText(f.text,sx,sy);
    }
    ctx.globalAlpha=1;
  }
  if(dpSel) placeDepotPanel();
}
function vt(x,y,a){const cs=Math.cos(a)*VB, sn=Math.sin(a)*VB; ctx.setTransform(cs,sn,-sn,cs,VX+x*VB,VY+y*VB);}
function shadowRect(g,o,k){const w=(o.w-.28)*k,h=(o.h-.28)*k,cx=o.x+o.w/2,cy=o.y+o.h/2;g.fillStyle='rgba(50,56,46,.18)';rr(g,cx-w/2+.07,cy-h/2+.11,w,h,.28);g.fill();}
function houseShadow(g,h,k){g.fillStyle='rgba(50,56,46,.16)';rr(g,h.x+.2+.06,h.y+.2+.09,.62*k,.62*k,.12);g.fill();}
function notch(g,o,color,w){const px=o.cx+.5+DX[o.d]*.43, py=o.cy+.5+DY[o.d]*.43, a=o.d*Math.PI/4, cs=Math.cos(a), sn=Math.sin(a);
  g.fillStyle=color; g.beginPath();
  const pts=[[-.07,-w/2],[.07,-w/2],[.07,w/2],[-.07,w/2]];
  for(let i=0;i<4;i++){const [lx,ly]=pts[i];const X=px+lx*cs-ly*sn, Y=py+lx*sn+ly*cs; if(i)g.lineTo(X,Y); else g.moveTo(X,Y);}
  g.closePath(); g.fill();}
function drawHouse(g,h,k){
  const col=COLORS[h.color], x=h.x+.5, y=h.y+.5, s_=.62*k, r=.12*k;
  g.save(); g.translate(x,y); g.rotate(h.dir*Math.PI/4);
  g.fillStyle=col.c; rr(g,-s_/2,-s_/2,s_,s_,r); g.fill();
  g.fillStyle=col.d; g.beginPath(); g.moveTo(-s_/2,0); g.lineTo(s_/2,0); g.lineTo(s_/2,s_/2-r); g.arcTo(s_/2,s_/2,s_/2-r,s_/2,r); g.lineTo(-s_/2+r,s_/2); g.arcTo(-s_/2,s_/2,-s_/2,s_/2-r,r); g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.9)'; rr(g,s_/2-.07,-.07,.1,.14,.03); g.fill();
  g.restore();
}
function drawShop(s){
  const k=pop((G.time-s.born)*2.5), col=COLORS[s.color], L=LV[s.level];
  const gt=G.time-s.grown, bump=gt>=0&&gt<.7?1+.1*Math.sin(gt/.7*Math.PI):1;
  const cx=s.x+s.w/2, cy=s.y+s.h/2, sw=(s.w-.28)*k*bump, sh=(s.h-.28)*k*bump;
  if(s.timer>0){
    const pulse=G.failShop===s?1+.07*Math.sin(G.time*14):1, R=(Math.hypot(s.w,s.h)/2*.84+.22)*pulse;
    ctx.lineWidth=.16; ctx.strokeStyle='rgba(34,38,45,.13)'; ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283); ctx.stroke();
    ctx.strokeStyle=s.timer>.66?'#D8452F':INK; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+6.283*s.timer); ctx.stroke();
  }
  ctx.fillStyle=col.c; rr(ctx,cx-sw/2,cy-sh/2,sw,sh,.28*k); ctx.fill();
  if(k<1) return;
  const left=cx-sw/2, top=cy-sh/2;
  if(s.level>=2){ ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=.05; rr(ctx,left+.06,top+.06,sw-.12,sh-.12,.23); ctx.stroke(); }
  if(s.level>=3){ rr(ctx,left+.13,top+.13,sw-.26,sh-.26,.18); ctx.stroke(); }
  notch(ctx,s.door,'#fff',.34); if(s.door2) notch(ctx,s.door2,'#fff',.34); notch(ctx,s.dock,'#2B303A',.5);
  const cols=Math.max(4,Math.floor((sw-.36)/.25)), rows=Math.ceil(L.pins/cols);
  ctx.fillStyle=col.d; rr(ctx,left+.18,top+.18,sw-.36,.12+rows*.27,.12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath();
  for(let i=0;i<s.demand&&i<L.over;i++){ const r=Math.floor(i/cols), c=i%cols, n=Math.min(cols,s.demand-r*cols), px=cx+(c-(n-1)/2)*.25, py=top+.18+.195+r*.27; ctx.moveTo(px+.085,py); ctx.arc(px,py,.085,0,6.283); }
  ctx.fill();
  if(s.demand>L.over){ ctx.fillStyle='#FFD7CF'; ctx.beginPath();
    for(let i=L.over;i<s.demand;i++){ const r=Math.floor(i/cols), c=i%cols, n=Math.min(cols,s.demand-r*cols), px=cx+(c-(n-1)/2)*.25, py=top+.18+.195+r*.27; ctx.moveTo(px+.085,py); ctx.arc(px,py,.085,0,6.283); }
    ctx.fill(); }
  const bw=(sw-.4)/s.max;
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.beginPath();
  for(let i=0;i<s.stock;i++) ctx.rect(left+.2+i*bw,top+sh-.52,bw-.04,.32);
  ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath();
  for(let i=s.stock;i<s.max;i++) ctx.rect(left+.2+i*bw,top+sh-.52,bw-.04,.32);
  ctx.fill();
  if(s.stock===0&&Math.floor(G.time*3)%2===0){ctx.strokeStyle=INK;ctx.lineWidth=.07;rr(ctx,left-.06,top-.06,sw+.12,sh+.12,.32);ctx.stroke();}
}
function drawDepotBody(g,d,k){
  const cx=d.x+1, cy=d.y+1, sz=1.72*k;
  g.fillStyle=DEPOT; rr(g,cx-sz/2,cy-sz/2,sz,sz,.24*k); g.fill();
  if(k<1) return;
  notch(g,d.dock,'#2B303A',.5); notch(g,d.door,'#fff',.34);
  g.lineWidth=.035; g.strokeStyle=CRATE_D;
  for(const [ox_,oy_] of [[-.5,-.5],[.06,-.5],[-.5,.06],[.06,.06]]){
    g.fillStyle=CRATE; rr(g,cx+ox_,cy+oy_,.44,.44,.06); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(cx+ox_+.07,cy+oy_+.07); g.lineTo(cx+ox_+.37,cy+oy_+.37); g.moveTo(cx+ox_+.37,cy+oy_+.07); g.lineTo(cx+ox_+.07,cy+oy_+.37); g.stroke();
  }
}
function drawDepotExtras(d){
  const cx=d.x+1, cy=d.y+1;
  let idleT=0, idleK=0;
  for(const t of G.trains) if(t.depot===d&&t.phase==='idle') idleT++;
  for(const c of G.cars) if(c.kind==='truck'&&c.depot===d&&c.phase==='idle') idleK++;
  if(idleT){ ctx.fillStyle='#fff'; ctx.beginPath(); for(let i=0;i<idleT&&i<5;i++) ctx.rect(cx-.78+i*.3,cy+.66,.24,.11); ctx.fill(); }
  if(idleK){ ctx.fillStyle=CRATE; ctx.beginPath(); for(let i=0;i<idleK&&i<5;i++) ctx.rect(cx+.6-i*.22,cy+.64,.16,.14); ctx.fill(); }
  // culori deservite (doar daca nu sunt toate)
  let all=true; for(let c=0;c<G.colorsUsed;c++) if(!((d.serve>>c)&1)) all=false;
  if(!all){ let n=0; for(let c=0;c<G.colorsUsed;c++) if((d.serve>>c)&1){ ctx.fillStyle=COLORS[c].c; ctx.beginPath(); ctx.arc(cx-.7+n*.26,cy-1.08,.1,0,6.283); ctx.fill(); n++; } }
  if(dpSel===d){ ctx.strokeStyle=INK; ctx.lineWidth=.08; ctx.setLineDash([.18,.12]); ctx.lineDashOffset=-G.time*.6; rr(ctx,cx-1.08,cy-1.08,2.16,2.16,.36); ctx.stroke(); ctx.setLineDash([]); }
}
function drawLights(){
  for(const [t,ns] of G.nodeState){
    if(ctrl[t]!==1) continue;
    const x=t%W+.5, y=((t/W)|0)+.5;
    for(let d=0;d<8;d++){
      if(!(roadE[t]&(1<<d))||!roadN[t+DOFF[d]]) continue;
      const ux=DX[d]/DLEN[d], uy=DY[d]/DLEN[d], px=x+ux*.52+uy*.36, py=y+uy*.52-ux*.36;
      ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(px,py,.125,0,6.283); ctx.fill();
      ctx.fillStyle=(d&3)===ns.phase?GREEN:'#E8604C'; ctx.beginPath(); ctx.arc(px,py,.08,0,6.283); ctx.fill();
    }
  }
}
function drawCar(c){
  vt(c.x,c.y,c.ang);
  if(c.kind==='truck'){
    ctx.fillStyle='rgba(40,44,40,.2)'; rr(ctx,-.25,-.1,.54,.28,.07); ctx.fill();
    ctx.fillStyle=c.phase==='go'?CRATE:'#A7ACB2'; rr(ctx,-.29,-.14,.4,.28,.05); ctx.fill();
    ctx.strokeStyle=c.phase==='go'?CRATE_D:'#80858C'; ctx.lineWidth=.03; ctx.stroke();
    ctx.fillStyle='#2B303A'; rr(ctx,.12,-.125,.17,.25,.05); ctx.fill();
    ctx.fillStyle='#5E6676'; ctx.fillRect(.2,-.09,.06,.18);
  } else {
    const col=COLORS[c.color];
    ctx.fillStyle='rgba(40,44,40,.2)'; rr(ctx,-.18,-.08,.4,.24,.08); ctx.fill();
    ctx.fillStyle=col.c; rr(ctx,-.2,-.115,.4,.23,.085); ctx.fill();
    ctx.fillStyle=col.l; ctx.fillRect(-.08,-.085,.15,.17);
  }
}
function drawTrain(tr){
  const total=tr.cum[tr.cum.length-1];
  for(let i=TRAIN_PARTS.length-1;i>=0;i--){
    const ps=tr.s-TRAIN_PARTS[i]; if(ps<.35||ps>total-.35) continue;
    const [x,y,a]=trainPos(tr,ps);
    vt(x,y,a);
    ctx.fillStyle='rgba(40,44,40,.22)'; rr(ctx,-.3,-.12,.64,.34,.08); ctx.fill();
    if(i===0){
      ctx.fillStyle='#2B303A'; rr(ctx,-.33,-.17,.66,.34,.09); ctx.fill();
      ctx.fillStyle='#5E6676'; ctx.fillRect(-.26,-.1,.3,.2);

function initAudio(){

}
function applyVolumes(){ if(!AC) return; sfxGain.gain.value=(SAVE.settings.sfx/100)**1.5; musGain.gain.value=(SAVE.settings.music/100)**1.5*.8; }
function tone(f,dur,type,vol,delay,dest){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

}

  const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=buf; f.type='lowpass'; f.frequency.value=900; g.gain.value=vol;
  s.connect(f).connect(g).connect(sfxGain); s.start();
}
const NOTES=[523.25,587.33,659.25,783.99,880];
function sfx(k,a){
  if(!AC||G.mode!=='play') return;
  switch(k){
    case 'deliver': tone(NOTES[a%5],.4,'sine',.06); tone(NOTES[a%5]*2,.25,'sine',.015,.02); break;
    case 'build': {const n=performance.now(); if(n-lastBuild>40){lastBuild=n; tone(380+Math.random()*60,.05,'triangle',.035);} break;}
    case 'erase': tone(200,.08,'triangle',.04); break;
    case 'place': tone(440,.08,'triangle',.05); tone(660,.12,'triangle',.04,.06); break;
    case 'horn': tone(196,.28,'square',.012); tone(247,.28,'square',.012,.03); break;
    case 'goods': tone(330,.12,'triangle',.05); tone(494,.2,'triangle',.05,.08); break;
    case 'spawn': tone(700,.12,'sine',.025); break;
    case 'crash': noise(.7,.5); tone(90,.5,'sawtooth',.05); break;
    case 'fail': tone(300,.6,'sawtooth',.03); tone(200,.8,'sawtooth',.03,.25); break;
    case 'week': [523,659,784].forEach((f,i)=>tone(f,.35,'sine',.05,i*.1)); break;
    case 'grow': [392,523,659,784].forEach((f,i)=>tone(f,.3,'triangle',.045,i*.07)); break;

}
const CHORDS=[[261.63,329.63,392.0,493.88],[220.0,261.63,329.63,392.0],[174.61,220.0,261.63,329.63],[196.0,246.94,293.66,392.0]];
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
function startMusic(){
  let next=AC.currentTime+.3, ci=0;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100; lp.connect(musGain);
  musTimer=setInterval(()=>{
    if(!AC||AC.state!=='running') return;
    while(next<AC.currentTime+2){
      for(const f of CHORDS[ci%4]){
        const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f/2; o.detune.value=(Math.random()-.5)*8;
        g.gain.setValueAtTime(0,next); g.gain.linearRampToValueAtTime(.022,next+1.6); g.gain.linearRampToValueAtTime(.016,next+4); g.gain.linearRampToValueAtTime(0,next+6);
        o.connect(g).connect(lp); o.start(next); o.stop(next+6.2);

      for(let j=0;j<4;j++) if(Math.random()<.5) tone(pick(PENTA),1.4,'sine',.018,next-AC.currentTime+j*1.2+Math.random()*.3,lp);

const touches=new Map(); let pend=null, pinch=null, pinchLock=false;
function startPinch(){

function updatePinch(){

cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});

    if(!G||G.mode!=='play'||G.over||G.modal) return;
    if(touches.size>=2){ pend=null; drag=null; pinchLock=true; if(touches.size===2) startPinch(); return; }
    if(pinchLock||!canPlay()) return;
    pend={e:{clientX:e.clientX,clientY:e.clientY,pointerId:e.pointerId,button:0,pointerType:'touch'},t0:performance.now()};

cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){

    if(pinch&&touches.size>=2){ updatePinch(); return; }
    if(pend&&pend.e.pointerId===e.pointerId){
      const dx=e.clientX-pend.e.clientX, dy=e.clientY-pend.e.clientY;

  const [fx_,fy_]=ptrTile(e), x=Math.floor(fx_), y=Math.floor(fy_);

function endPointer(e){

function registerTile(t){

function buildCityGrid(){
  const grid=$('cityGrid'); grid.innerHTML='';
  const wat=new Uint8Array(N), mnt=new Uint8Array(N), tre=new Uint8Array(N);
  CITIES.forEach((c,i)=>{
    const ok=unlocked(i);
    const btn=document.createElement('button'); btn.className='cityCard'; btn.disabled=!ok;
    const cvs=document.createElement('canvas'); cvs.width=240; cvs.height=150;
    genTerrain(c,wat,mnt,tre);
    const g=cvs.getContext('2d'), s=5;
    g.fillStyle=c.land; g.fillRect(0,0,240,150);
    for(let t=0;t<N;t++){const x=t%W,y=(t/W)|0; if(wat[t]){g.fillStyle=c.water;g.fillRect(x*s,y*s,s,s);} else if(mnt[t]){g.fillStyle=c.mount;g.fillRect(x*s,y*s,s,s);} else if(tre[t]){g.fillStyle=c.treeC;g.beginPath();g.arc(x*s+2.5,y*s+2.5,2,0,6.283);g.fill();}}
    const col=COLORS[i%5]; g.fillStyle=col.c; g.fillRect(116,70,10,10);
    const info=document.createElement('div'); info.className='info';
    const best=SAVE.best[c.id]||0;
    info.innerHTML='<b></b><span></span>';
    info.querySelector('b').textContent=cityName(c);
    info.querySelector('span').textContent=ok?(best?tr('bestLbl',{n:best}):tr('notPlayed')):tr('unlockReq',{n:c.need,c:cityName(CITIES[i-1])});
    btn.append(cvs,info);
    btn.onclick=()=>startCity(i);
    grid.appendChild(btn);
  });
}

let acc=0, lastT=performance.now();
function frame(now){
  const rdt=Math.min(.1,(now-lastT)/1000); lastT=now;
  const running=G.mode==='demo'?true:(G.mode==='play'&&!G.over&&!G.paused&&!G.modal&&$('scrPause').hidden&&$('scrSettings').hidden&&$('scrHow').hidden);
  if(running){
    acc+=rdt*(G.mode==='demo'?1:G.speed); let n=0;
    while(acc>=STEP&&n<10){ step(STEP); acc-=STEP; n++; if(G.over||G.modal){acc=0;break;} }
    if(n>=10) acc=0;
    if(G.mode==='play') updateHud();
  }
  for(const f of G.fx) f.t+=rdt*1.1; if(G.fx.length) G.fx=G.fx.filter(f=>f.t<1);
  if(toastT>0){ toastT-=rdt; if(toastT<=0) $('toast').classList.remove('show'); }
  if(dpSel){ dpRefreshT-=rdt; if(dpRefreshT<=0){ dpRefreshT=.25; refreshDepot(); } }
  fitCam(false);
  render(rdt);
  requestAnimationFrame(frame);
}

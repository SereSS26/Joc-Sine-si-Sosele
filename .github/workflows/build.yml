# Construieste automat versiunile de Windows si Mac pe GitHub (tab-ul Actions)
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            path: out/win-unpacked
          - os: macos-latest
            script: dist:mac
            path: out/mac-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: sine-si-sosele-${{ matrix.os }}
          path: ${{ matrix.path }}

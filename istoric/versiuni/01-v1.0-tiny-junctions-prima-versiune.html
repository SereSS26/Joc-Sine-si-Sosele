<title>Tiny Junctions</title>
<style>
/*@FONTFACE@*/
:root{
  --ink:#22262D; --ink2:#3A3F48; --muted:#6A7068; --panel:#F7F8F4; --panel2:#ECEEE7;
  --line:#D3D7CD; --fog:#CFD4C8; --accent:#E8604C; --good:#2FA38D;
  --shadow:0 10px 30px rgba(34,38,45,.16), 0 2px 6px rgba(34,38,45,.08);
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --ui:Barlow, "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{margin:0;background:var(--fog);color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none;}
#app{position:fixed;inset:0;}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;}
button{font-family:inherit;color:inherit;font-size:inherit;}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

/* ---------- HUD ---------- */
#hudTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;pointer-events:none;}
#hudTop > *{pointer-events:auto;}
.city{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;}
.weekRow{display:flex;align-items:center;gap:8px;margin-top:5px;font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
.weekBar{width:96px;height:5px;border-radius:3px;background:rgba(34,38,45,.12);overflow:hidden;}
.weekBar i{display:block;height:100%;width:0;background:var(--ink);border-radius:3px;}
.scoreBox{display:flex;flex-direction:column;align-items:center;}
.scoreBox b{font-family:var(--display);font-size:46px;font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;}
.scoreBox span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.hudRight{display:flex;gap:8px;justify-content:flex-end;}
.speed{display:flex;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:4px;gap:2px;}
.speed button{width:40px;height:34px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;}
.speed button:hover{background:var(--panel2);}
.speed button.on{background:var(--ink);color:#fff;}
.speed svg{height:14px;}
.round{width:42px;height:42px;border:0;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;}
.round:hover{background:#fff;}
.round svg{width:18px;height:18px;}

#toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;gap:4px;padding:6px;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);white-space:nowrap;}
.tool{position:relative;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 12px 8px 9px;border-radius:14px;cursor:pointer;font-weight:600;font-size:14px;}
.tool:hover{background:var(--panel2);}
.tool.on{background:var(--ink);color:#fff;}
.tool svg{width:24px;height:24px;flex:none;}
.tool .cnt{font-variant-numeric:tabular-nums;font-weight:700;min-width:18px;text-align:right;opacity:.9;}
.tool kbd{position:absolute;top:3px;right:4px;font-family:inherit;font-size:9px;font-weight:700;opacity:.45;}
.sep{width:1px;height:30px;background:var(--line);margin:0 6px;}
.stat{display:flex;align-items:center;gap:6px;padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;}
.stat svg{width:24px;height:24px;}
.stat small{font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.flash{animation:flash .4s ease 2;}
@keyframes flash{50%{background:var(--accent);color:#fff;}}

#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:15px;line-height:1.35;max-width:min(560px,calc(100% - 32px));text-align:center;box-shadow:var(--shadow);transition:opacity .25s,transform .25s;opacity:0;pointer-events:none;}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(207,212,200,.62);}
.screen.clear{background:transparent;}
.card{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:30px;width:100%;max-width:480px;max-height:calc(100% - 32px);overflow:auto;}
.tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
h2{font-family:var(--display);font-size:42px;font-weight:900;line-height:.95;margin:0 0 10px;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;}
.card p{margin:0 0 16px;line-height:1.45;color:#454A52;font-size:15px;}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:17px;padding:14px 18px;border-radius:14px;cursor:pointer;letter-spacing:.02em;}
.btn:hover{background:var(--ink2);}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink);}
.stack{display:grid;gap:10px;}

/* main menu */
#scrMain{justify-content:flex-start;background:linear-gradient(90deg,rgba(207,212,200,.92) 0,rgba(207,212,200,.55) 420px,rgba(207,212,200,0) 720px);padding:0;}
.mainPanel{display:flex;flex-direction:column;justify-content:center;gap:28px;height:100%;padding:0 clamp(24px,6vw,80px);max-width:440px;box-sizing:border-box;}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(64px,9vw,104px);line-height:.82;letter-spacing:.01em;margin:0;text-transform:uppercase;}
.logo span{display:block;color:var(--accent);}
.tagline{font-size:17px;font-weight:600;color:#454A52;margin:-10px 0 0;}
.mainPanel .stack{max-width:300px;}
.mainPanel .btn.ghost{background:rgba(247,248,244,.9);box-shadow:inset 0 0 0 2px rgba(34,38,45,.12);}
.mainPanel .btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink);}
.ver{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;}

/* cities */
.wide{max-width:900px;}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:18px 0 20px;}
.cityCard{border:0;background:#fff;border-radius:16px;padding:0;cursor:pointer;text-align:left;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;}
.cityCard:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--ink);}
.cityCard:disabled{cursor:not-allowed;}
.cityCard canvas{width:100%;aspect-ratio:8/5;display:block;}
.cityCard .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;}
.cityCard b{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;line-height:1;}
.cityCard span{font-size:12px;font-weight:600;color:var(--muted);}
.cityCard:disabled canvas{filter:grayscale(1) opacity(.45);}
.lockTag{display:inline-flex;align-items:center;gap:4px;}

/* settings */
.setRow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;}
.setRow:last-of-type{border-bottom:0;margin-bottom:12px;}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px;}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;}
.seg button.on{background:var(--ink);color:#fff;}
input[type=range]{width:160px;accent-color:var(--ink);}

/* how */
.how{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:14px;}
.how li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;}
.how svg{width:44px;height:44px;}
.how b{display:block;margin-bottom:2px;}
.how span{font-size:14px;line-height:1.45;color:#454A52;}
.keys{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px;}

/* week choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px;}
.choice{border:0;background:#fff;border-radius:18px;padding:20px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 2px var(--line);}
.choice:hover{box-shadow:inset 0 0 0 2px var(--ink);transform:translateY(-1px);}
.choice svg{width:40px;height:40px;}
.choice b{font-size:18px;}
.choice span{font-size:13px;color:var(--muted);line-height:1.35;}

.stats{display:flex;gap:26px;margin:6px 0 20px;flex-wrap:wrap;}
.stats div{display:flex;flex-direction:column;}
.stats b{font-family:var(--display);font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.stats span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.unlock{background:#E3F2EE;color:#1F6F60;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:16px;}

@media (max-width:1000px){ .tool .lbl,.stat small{display:none;} .tool{padding:8px 10px;} }
@media (max-width:640px){
  .city{font-size:22px;} .scoreBox b{font-size:34px;} .speed button{width:32px;}
  #hudTop{grid-template-columns:auto 1fr auto;}
  .choices{grid-template-columns:1fr;}
  #scrMain{background:rgba(207,212,200,.85);}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none;}#toast{transition:none;}}
</style>

<script>
(()=>{
'use strict';
// =====================================================================
//  CONSTANTE
// =====================================================================
const W=48,H=30,N=W*H;
const DX=[1,1,0,-1,-1,-1,0,1], DY=[0,1,1,1,0,-1,-1,-1];
const DOFF=DX.map((d,i)=>d+DY[i]*W);
const DLEN=DX.map((d,i)=>(d&&DY[i])?Math.SQRT2:1);
const DLUT=new Int8Array(9).fill(-1); for(let d=0;d<8;d++) DLUT[(DY[d]+1)*3+DX[d]+1]=d;
const STEP=1/60;

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dirIdx(a,b){const dx=(b%W)-(a%W),dy=((b/W)|0)-((a/W)|0);if(dx<-1||dx>1||dy<-1||dy>1)return -1;return DLUT[(dy+1)*3+dx+1];}

const water=new Uint8Array(N), mount=new Uint8Array(N), tree=new Uint8Array(N);

const bmap=new Array(N).fill(null);

function genTerrain(city,wat,mnt,tre){
  wat.fill(0);mnt.fill(0);tre.fill(0);
  const r=mulberry(city.seed), R=(a,b)=>a+r()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1));
  const set=(A,x,y)=>{if(x>=0&&y>=0&&x<W&&y<H)A[y*W+x]=1;};
  const blob=(A,cx,cy,rad)=>{for(let y=Math.floor(cy-rad-1);y<=cy+rad+1;y++)for(let x=Math.floor(cx-rad-1);x<=cx+rad+1;x++){if(Math.hypot(x-cx,y-cy)<=rad+(r()-.5)*.9)set(A,x,y);}};
  const far=(minD)=>{for(let k=0;k<60;k++){const x=R(3,W-4),y=R(3,H-4);if(Math.hypot(x-W/2,y-H/2)>minD)return[x,y];}return[5,5];};
  for(const f of city.feats){
    if(f==='riverV'){let x=RI(Math.floor(W*.36),Math.floor(W*.6));const wide=r()<.5;for(let y=0;y<H;y++){set(wat,x,y);if(wide&&y%9<4)set(wat,x+1,y);if(r()<.3){const nx=clamp(x+(r()<.5?-1:1),5,W-6);set(wat,nx,y);x=nx;}}}
    if(f==='riverH'){let y=RI(Math.floor(H*.28),Math.floor(H*.68));for(let x=0;x<W;x++){set(wat,x,y);if(r()<.26){const ny=clamp(y+(r()<.5?-1:1),3,H-4);set(wat,x,ny);y=ny;}}}
    if(f==='lake'){const [cx,cy]=far(8);blob(wat,cx,cy,R(1.7,2.6));}
    if(f==='lakes'){for(let i=0;i<3;i++){const [cx,cy]=far(7);blob(wat,cx,cy,R(1.2,2.1));}}
    if(f==='sea'){let cx=W-7;for(let y=0;y<H;y++){cx+=RI(-1,1);cx=clamp(cx,W-10,W-5);for(let x=cx;x<W;x++)set(wat,x,y);}}
    if(f==='mountains'){for(let i=0;i<8;i++){const [cx,cy]=far(8);blob(mnt,cx,cy,R(1.3,2.8));}}
  }
  for(let y=H/2-5;y<H/2+5;y++)for(let x=W/2-6;x<W/2+6;x++)mnt[y*W+x]=0;
  for(let i=0;i<N;i++)if(wat[i])mnt[i]=0;
  const clusters=Math.round(city.trees*34);
  for(let i=0;i<clusters;i++){const cx=R(0,W),cy=R(0,H),rad=R(.9,2.2);
    for(let y=Math.floor(cy-rad);y<=cy+rad;y++)for(let x=Math.floor(cx-rad);x<=cx+rad;x++){if(!inGrid(x,y))continue;const t=y*W+x;if(!wat[t]&&!mnt[t]&&r()<.6&&Math.hypot(x-cx,y-cy)<=rad)tre[t]=1;}}
}

function addEdge(E,a,d){E[a]|=1<<d;E[a+DOFF[d]]|=1<<((d+4)&7);}
function bumpVer(kind){if(kind==='road')G.roadVer++;else G.railVer++;G.staticDirty=true;}
function flashRes(k){
  const el={bridge:$('sBridge'),road:$('tRoad'),rail:$('tRail'),barrier:$('tBarrier'),overpass:$('tOverpass')}[k];
  if(!el)return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function placeNode(t,kind,free){
  const NN=kind==='road'?roadN:railN;
  if(NN[t]) return true;
  if(bmap[t]||mount[t]||!inBt(t)) return false;
  if(!free){
    if(water[t]){ if(G.res.bridge<=0){flashRes('bridge');hint('hNoBridge',4);return false;} G.res.bridge--; }
    else { if(G.res[kind]<=0){flashRes(kind);hint('hNoRes',4,{r:tr(kind==='road'?'rnRoad':'rnRail')});return false;} G.res[kind]--; }
  }
  NN[t]=1; tree[t]=0; bumpVer(kind);
  if(roadN[t]&&railN[t]) newCrossing(t);
  sfx('build');
  return true;
}
function newCrossing(t){
  xing[t]=0;
  if(G.res.barrier>0&&G.mode!=='demo'){G.res.barrier--;xing[t]=1;}
  else if(G.mode==='demo'){xing[t]=1;}
  else hint('hUnguarded',7);
}
function diagBlocked(a,d){
  if(!(d&1)) return false;
  const x=a%W,y=(a/W)|0,dx=DX[d],dy=DY[d];
  const s1=idx(x+dx,y), s2=idx(x,y+dy), b=a+DOFF[d];
  if(water[s1]&&water[s2]&&!(water[a]&&water[b])) return true;
  if(mount[s1]&&mount[s2]) return true;
  if(bmap[s1]&&bmap[s2]) return true;
  const od=DLUT[(dy+1)*3+(-dx)+1];
  return ((roadE[s1]|railE[s1])&(1<<od))!==0;
}
function connect(a,b,kind,free){
  const d=dirIdx(a,b); if(d<0) return false;
  const E=kind==='road'?roadE:railE, NN=kind==='road'?roadN:railN;
  if(E[a]&(1<<d)) return true;
  if(bmap[b]) return false;
  if((kind==='road'?railE:roadE)[a]&(1<<d)){hint('hParallel',3,null,true);return false;}
  if(!NN[a]&&!placeNode(a,kind,free)) return false;
  if(diagBlocked(a,d)){hint('hDiag',3);return false;}
  if(!placeNode(b,kind,free)) return false;
  addEdge(E,a,d); bumpVer(kind);
  return true;
}
function eraseTile(t){
  if(!inGrid(t%W,(t/W)|0)) return;
  const wasX=roadN[t]&&railN[t];
  let did=false;
  for(const kind of ['road','rail']){
    const NN=kind==='road'?roadN:railN, E=kind==='road'?roadE:railE, bit=kind==='road'?1:2;
    if(!NN[t]) continue;
    const fixed=fixedT[t]&bit;
    for(let d=0;d<8;d++){
      if(!(E[t]&(1<<d))) continue;
      const n=t+DOFF[d];
      if(fixed&&bmap[n]) continue;
      E[n]&=~(1<<((d+4)&7)); E[t]&=~(1<<d); did=true;
    }
    if(!fixed){ NN[t]=0; E[t]=0; if(water[t])G.res.bridge++; else G.res[kind]++; did=true; }
    bumpVer(kind);
  }
  if(wasX&&!(roadN[t]&&railN[t])){ if(xing[t]===1)G.res.barrier++; else if(xing[t]===2)G.res.overpass++; xing[t]=0; }
  if(did) sfx('erase');
}
function applySpecial(t,tool){
  if(!(roadN[t]&&railN[t])){hint('hPick',3,null,true);return;}
  if(tool==='barrier'){
    if(xing[t]!==0) return;
    if(G.res.barrier<=0){flashRes('barrier');hint('hNoBarrier',3,null,true);return;}
    G.res.barrier--; xing[t]=1; sfx('place');
  } else {
    if(xing[t]===2) return;
    if(G.res.overpass<=0){flashRes('overpass');hint('hNoOverpass',3,null,true);return;}
    if(xing[t]===1) G.res.barrier++;
    G.res.overpass--; xing[t]=2; G.staticDirty=true; sfx('place');
  }
}

// =====================================================================
//  DRUMURI OPTIME (Dijkstra + cache)
// =====================================================================
const HN=new Int32Array(N*9), HP=new Float32Array(N*9); let hs=0, popP=0;
function hpush(n,p){let i=hs++;while(i>0){const q=(i-1)>>1;if(HP[q]<=p)break;HN[i]=HN[q];HP[i]=HP[q];i=q;}HN[i]=n;HP[i]=p;}
function hpop(){const n=HN[0];popP=HP[0];const ln=HN[--hs],lp=HP[hs];let i=0;for(;;){let c=2*i+1;if(c>=hs)break;if(c+1<hs&&HP[c+1]<HP[c])c++;if(HP[c]>=lp)break;HN[i]=HN[c];HP[i]=HP[c];i=c;}if(hs>0){HN[i]=ln;HP[i]=lp;}return n;}
const srcMark=new Uint8Array(N);
function dijkstra(sources,E,NN,dist,prev,stopAt){
  dist.fill(Infinity);prev.fill(-1);hs=0;
  for(const s of sources){dist[s]=0;srcMark[s]=1;hpush(s,0);}
  let found=-1;
  while(hs>0){
    const t=hpop(),d=popP;
    if(d>dist[t]) continue;
    if(t===stopAt){found=t;break;}
    if(!NN[t]&&!srcMark[t]) continue;
    const m=E[t]; if(!m) continue;
    for(let k=0;k<8;k++){ if(!(m&(1<<k))) continue; const n=t+DOFF[k], nd=d+DLEN[k]; if(nd<dist[n]){dist[n]=nd;prev[n]=t;hpush(n,nd);} }
  }
  for(const s of sources) srcMark[s]=0;
  return found;
}
function trace(prev,from){const p=[];let k=from;while(k!==-1){p.push(k);k=prev[k];}return p;}
const tmpDist=new Float32Array(N), tmpPrev=new Int32Array(N);
function shopRoad(s){if(s.rc.ver!==G.roadVer){dijkstra(s.cells,roadE,roadN,s.rc.dist,s.rc.prev,-1);s.rc.ver=G.roadVer;}return s.rc;}
function depotRail(d){if(d.rc.ver!==G.railVer){dijkstra(d.cells,railE,railN,d.rc.dist,d.rc.prev,-1);d.rc.ver=G.railVer;}return d.rc;}

function nearBig(x,y){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!inGrid(x+dx,y+dy))continue;const b=bmap[idx(x+dx,y+dy)];if(b&&b.type!=='house')return true;}
  return false;
}
function addHouse(x,y,color,d){
  const t=idx(x,y), h={type:'house',id:uid++,x,y,t,color,home:2,dir:d,born:G.time};
  bmap[t]=h; tree[t]=0; G.houses.push(h);
  const n=t+DOFF[d];

}
function tryHouse(color,nearShop){

    let x,y;

    else if(shops.length&&a<130){const s=pick(shops),ang=rnd(0,6.283),d=rnd(4.5,8.5);x=Math.round(s.x+.5+Math.cos(ang)*d);y=Math.round(s.y+.5+Math.sin(ang)*d);}

const SIDES=[
  {d:0,tiles:[[2,0],[2,1]],cells:[[1,0],[1,1]]},
  {d:2,tiles:[[0,2],[1,2]],cells:[[0,1],[1,1]]},
  {d:4,tiles:[[-1,0],[-1,1]],cells:[[0,0],[0,1]]},
  {d:6,tiles:[[0,-1],[1,-1]],cells:[[0,0],[1,0]]},
];
function areaOk(x,y){
  for(let yy=y-1;yy<=y+2;yy++)for(let xx=x-1;xx<=x+2;xx++){
    const inner=xx>=x&&xx<=x+1&&yy>=y&&yy<=y+1;
    if(inner){ if(!inB(xx,yy)||!tileFree(idx(xx,yy))) return false; }
    else if(inGrid(xx,yy)&&bmap[idx(xx,yy)]) return false;
  }
  return true;
}
function okDoor(x,y,kind){
  if(!inB(x,y)) return false;
  const t=idx(x,y);
  if(water[t]||mount[t]||bmap[t]) return false;
  return kind==='road'?!railN[t]:!roadN[t];
}
function findSide(x,y,order,kind){
  for(const S of order){
    const ks=Math.random()<.5?[0,1]:[1,0];
    for(const k of ks){const [ox,oy]=S.tiles[k];if(okDoor(x+ox,y+oy,kind))return {S,k};}
  }

}
function sideOrder(x,y,rand){
  const b=G.bounds, cx=(b.x0+b.x1+1)/2, cy=(b.y0+b.y1+1)/2;
  return [...SIDES].map(S=>({S,v:DX[S.d]*(cx-(x+1))+DY[S.d]*(cy-(y+1))+Math.random()*rand})).sort((a,b)=>b.v-a.v).map(o=>o.S);
}
function placeSpot(near,a){
  const b=G.bounds;
  if(near&&a<160){const ang=rnd(0,6.283),d=rnd(near.min,near.max);return [Math.round(near.x+Math.cos(ang)*d),Math.round(near.y+Math.sin(ang)*d)];}
  return [ri(b.x0+1,b.x1-2),ri(b.y0+1,b.y1-2)];
}
function tooClose(x,y,a){return [...G.shops,...G.depots].some(o=>Math.hypot(o.x-x,o.y-y)<(a<300?6.5:4.5));}
function tryShop(color,near){
  for(let a=0;a<420;a++){

    const opp=SIDES.find(S=>S.d===((rd.S.d+4)&7));

    const s={type:'shop',id:uid++,x,y,color,cells:[idx(x,y),idx(x+1,y),idx(x,y+1),idx(x+1,y+1)],
      demand:0,pinAcc:.3,stock:6,max:8,inCars:0,inGoods:0,timer:0,born:G.time,rc:mkCache()};
    for(const c of s.cells){bmap[c]=s;tree[c]=0;}
    const [rx,ry]=rd.S.tiles[rd.k], [rcx,rcy]=rd.S.cells[rd.k];

function tryDepot(near){

// demo / teste: legare automata
function autoRoute(from,goals,kind){
  const prev=new Int32Array(N).fill(-2), q=[from]; prev[from]=-1;
  const NN=kind==='road'?roadN:railN, OTHER=kind==='road'?railN:roadN;
  for(let h=0;h<q.length;h++){
    const t=q[h];
    for(let d=0;d<8;d++){
      const x=t%W+DX[d],y=((t/W)|0)+DY[d]; if(!inB(x,y)) continue;
      const n=idx(x,y); if(prev[n]!==-2) continue;
      if(diagBlocked(t,d)) continue;
      if((kind==='road'?railE:roadE)[t]&(1<<d)) continue;
      if(goals.has(n)){prev[n]=t;const p=[];let k=n;while(k!==-1){p.push(k);k=prev[k];}return p.reverse();}
      if(bmap[n]||mount[n]||(fixedT[n]&&!NN[n])) continue;
      if(OTHER[n]&&kind==='rail') continue;
      prev[n]=t; q.push(n);
    }
  }
  return null;
}
function doorTiles(o,kind){const E=kind==='road'?roadE:railE, out=new Set();for(const c of o.cells)for(let d=0;d<8;d++)if(E[c]&(1<<d))out.add(c+DOFF[d]);return out;}
function autoConnect(from,goals,kind,free){const p=autoRoute(from,goals,kind);if(!p)return false;for(let i=0;i+1<p.length;i++)connect(p[i],p[i+1],kind,free);return true;}
function demoConnectAll(){

  for(const s of G.shops){

function dispatch(){
  for(const s of G.shops){
    let guard=3;
    while(guard--&&s.demand-s.inCars>0&&s.stock-s.inCars>0){
      const rc=shopRoad(s); let best=null,bd=Infinity;
      for(const h of G.houses) if(h.color===s.color&&h.home>0&&rc.dist[h.t]<bd){bd=rc.dist[h.t];best=h;}
      if(!best) break;
      const p=trace(rc.prev,best.t);
      best.home--; s.inCars++;
      const c={id:uid++,h:best,s,path:p,i:0,t:0,L:1,phase:'go',wait:0,blk:0,ghost:false,color:s.color,x:best.x+.5,y:best.y+.5,ang:best.dir*Math.PI/4,dead:false};
      c.L=DLEN[dirIdx(p[0],p[1])];
      G.cars.push(c);
    }
  }
}
function cancelCar(c){ if(c.phase==='go') c.s.inCars--; c.h.home++; c.dead=true; }
function rerouteCar(c){
  const a=c.path[c.i];
  if(c.phase==='go'){const rc=shopRoad(c.s);if(rc.dist[a]<Infinity){c.path=trace(rc.prev,a);c.i=0;return true;}return false;}
  if(dijkstra([c.h.t],roadE,roadN,tmpDist,tmpPrev,a)>=0){c.path=trace(tmpPrev,a);c.i=0;return true;}
  return false;
}
function carBlocked(c){
  const a=c.path[c.i], b=c.path[c.i+1];
  const same=G.segMap.get(a*N+b);
  if(same) for(const o of same){ if(o!==c&&(o.t>c.t||(o.t===c.t&&o.id<c.id))&&(o.t-c.t)*c.L<GAP) return true; }
  const nx=G.startMap.get(b);
  if(nx) for(const o of nx){ if(o.path[o.i+1]!==a&&o.t*o.L+(1-c.t)*c.L<GAP) return true; }
  return false;
}
function carMustStop(b){
  if(wreck[b]>0) return true;
  if(!(roadN[b]&&railN[b])) return false;
  const x=xing[b]; if(x===2) return false;
  return x===1?G.lock.has(b):G.occ.has(b);
}
function stepCar(c,dt){
  if(c.phase==='park'){
    c.wait-=dt; if(c.wait>0) return;
    const rc=shopRoad(c.s);
    if(rc.dist[c.h.t]===Infinity){c.h.home++;c.dead=true;return;}
    c.path=trace(rc.prev,c.h.t).reverse(); c.i=0; c.t=0; c.phase='back'; c.ghost=false; c.blk=0;
    c.L=DLEN[dirIdx(c.path[0],c.path[1])];
    return;
  }
  const b=c.path[c.i+1];
  let nt=c.t+CAR_SPEED*dt/c.L;
  if(!c.ghost&&carBlocked(c)){ c.blk+=dt; nt=c.t; if(c.blk>3.5) c.ghost=true; } else c.blk=0;
  const cap=1-.6/c.L;
  if(c.t<=cap&&carMustStop(b)) nt=Math.min(nt,cap);
  c.t=nt;
  if(c.t>=1){
    c.t-=1; c.i++; c.ghost=false; c.blk=0;
    if(c.i>=c.path.length-1){ c.t=0; arriveCar(c); return; }
    let d=dirIdx(c.path[c.i],c.path[c.i+1]);
    if(!(roadE[c.path[c.i]]&(1<<d))){ if(!rerouteCar(c)){cancelCar(c);return;} d=dirIdx(c.path[0],c.path[1]); c.t=0; }
    c.t=c.t*c.L/DLEN[d]; c.L=DLEN[d];
  }
  carPos(c);
}
function carPos(c){
  const a=c.path[c.i], b=c.path[c.i+1];
  const ax=a%W+.5, ay=((a/W)|0)+.5, bx=b%W+.5, by=((b/W)|0)+.5;
  const dx=bx-ax, dy=by-ay, l=Math.hypot(dx,dy)||1;
  c.x=ax+dx*c.t-dy/l*.17; c.y=ay+dy*c.t+dx/l*.17;
  const ta=Math.atan2(dy,dx); let d=ta-c.ang; while(d>Math.PI)d-=6.2832; while(d<-Math.PI)d+=6.2832; c.ang+=d*.3;
}
function arriveCar(c){
  if(c.phase==='go'){
    const s=c.s; s.stock--; s.demand--; s.inCars--; G.score++;
    fx(s.x+1,s.y+.1,'+1',COLORS[s.color].d); sfx('deliver',s.color);
    c.phase='park'; c.wait=.6;
  } else { c.h.home++; c.dead=true; }
}
function carNear(n,r2){
  const bx=n%W+.5, by=((n/W)|0)+.5;
  for(const c of G.cars){ if(c.dead||c.phase==='park') continue; const dx=c.x-bx,dy=c.y-by; if(dx*dx+dy*dy<r2) return c; }
  return null;
}

//  TRENURI, TRECERI, ACCIDENTE
// =====================================================================
function setPath(tr,p){
  tr.path=p; tr.cum=new Float32Array(p.length); for(let k=1;k<p.length;k++) tr.cum[k]=tr.cum[k-1]+DLEN[dirIdx(p[k-1],p[k])];
  tr.s=0; tr.seg=0;
}
function findJob(d){
  const rc=depotRail(d); let best=null,bd=Infinity;
  for(const s of G.shops){ if(s.stock+s.inGoods>s.max-3) continue; for(const c of s.cells) if(rc.dist[c]<bd){bd=rc.dist[c];best=c;} }
  return best===null?null:trace(rc.prev,best).reverse();
}
function startJob(tr,p){
  const s=bmap[p[p.length-1]]; tr.shop=s; tr.cargo=CARGO; s.inGoods+=CARGO;
  setPath(tr,p); tr.phase='go'; sfx('horn');
}
function toDepot(tr){ if(tr.phase==='go'&&tr.shop) tr.shop.inGoods-=tr.cargo; tr.cargo=0; tr.phase='idle'; tr.path=null; tr.cool=1; tr.held=-1; }
function rerouteTrain(tr){
  const a=tr.path[tr.seg];
  if(tr.phase==='back'){const rc=depotRail(tr.depot);if(rc.dist[a]<Infinity){setPath(tr,trace(rc.prev,a));return true;}return false;}
  if(dijkstra(tr.shop.cells,railE,railN,tmpDist,tmpPrev,a)>=0){setPath(tr,trace(tmpPrev,a));return true;}
  return false;
}
function trainMustStop(n){
  if(wreck[n]>0) return true;
  return roadN[n]&&railN[n]&&xing[n]===1&&carNear(n,.3)!==null;
}
function stepTrain(tr,dt){
  if(tr.phase==='idle'){ tr.cool-=dt; if(tr.cool<=0){ tr.cool=.8; const p=findJob(tr.depot); if(p) startJob(tr,p); } return; }
  if(tr.phase==='unload'){
    tr.wait-=dt; if(tr.wait>0) return;
    const rc=depotRail(tr.depot), end=tr.path[tr.path.length-1];
    if(rc.dist[end]===Infinity){toDepot(tr);return;}
    setPath(tr,trace(rc.prev,end)); tr.phase='back'; return;
  }
  if(tr.held>=0){ if(wreck[tr.held]>0) return; tr.held=-1; }
  let ns=tr.s+TRAIN_SPEED*dt;
  const k=tr.seg+1;
  if(k<tr.path.length-1){ const dn=tr.cum[k]-tr.s; if(dn>.5&&trainMustStop(tr.path[k])) ns=Math.min(ns,tr.cum[k]-.5); }
  tr.s=Math.max(tr.s,ns);
  while(tr.s>=tr.cum[tr.seg+1]){
    tr.seg++;
    if(tr.seg>=tr.path.length-1){ arriveTrain(tr); return; }
    const a=tr.path[tr.seg], d=dirIdx(a,tr.path[tr.seg+1]);
    if(!(railE[a]&(1<<d))){ if(!rerouteTrain(tr)){toDepot(tr);return;} break; }
  }
}
function arriveTrain(tr){
  if(tr.phase==='go'){
    const s=tr.shop; s.stock=Math.min(s.max,s.stock+tr.cargo); s.inGoods-=tr.cargo;
    fx(s.x+1,s.y+2.1,'+'+tr.cargo,INK); sfx('goods');
    tr.cargo=0; tr.phase='unload'; tr.wait=.7;
  } else { tr.phase='idle'; tr.path=null; tr.cool=.4; }
}
function trainPos(tr,s){
  const p=tr.path, cum=tr.cum; s=clamp(s,0,cum[cum.length-1]);
  let k=Math.min(tr.seg,p.length-2); while(k>0&&cum[k]>s)k--; while(k<p.length-2&&cum[k+1]<s)k++;
  const a=p[k],b=p[k+1],L=cum[k+1]-cum[k],f=L>0?(s-cum[k])/L:0;
  const ax=a%W+.5,ay=((a/W)|0)+.5,bx=b%W+.5,by=((b/W)|0)+.5;
  return [ax+(bx-ax)*f,ay+(by-ay)*f,Math.atan2(by-ay,bx-ax)];
}
const TRAIN_PARTS=[0,.78,1.5];
function computeLocks(){
  G.lock.clear(); G.occ.clear();
  for(const tr of G.trains){
    if(!tr.path||(tr.phase!=='go'&&tr.phase!=='back')) continue;
    const lo=Math.max(0,tr.seg-3), hi=Math.min(tr.path.length-1,tr.seg+4);
    for(let k=lo;k<=hi;k++){
      const n=tr.path[k]; if(!(roadN[n]&&railN[n])) continue;
      const dn=tr.cum[k]-tr.s;
      if(xing[n]===1&&dn>-1.9&&dn<2.3) G.lock.add(n);
      if(xing[n]===0&&dn>-1.9&&dn<.95) G.occ.add(n);
    }
  }
}
function checkAccidents(){
  for(const tr of G.trains){
    if(!tr.path||(tr.phase!=='go'&&tr.phase!=='back')) continue;
    const lo=Math.max(0,tr.seg-3), hi=Math.min(tr.path.length-1,tr.seg+2);
    for(let k=lo;k<=hi;k++){
      const n=tr.path[k];
      if(!(roadN[n]&&railN[n])||xing[n]!==0||wreck[n]>0) continue;
      for(const off of TRAIN_PARTS){
        const ps=tr.s-off; if(Math.abs(tr.cum[k]-ps)>.6) continue;
        const [px,py]=trainPos(tr,ps);
        for(const c of G.cars){
          if(c.dead||c.phase==='park') continue;
          const dx=c.x-px,dy=c.y-py;
          if(dx*dx+dy*dy<.1){ accident(n,c,tr); return; }
        }
      }
    }
  }
}
function accident(n,c,tr){
  wreck[n]=9; G.accidents++;
  if(c.phase==='go') c.s.inCars--;
  c.dead=true; G.pending.push({t:12,h:c.h});
  tr.held=n;
  fx(n%W+.5,((n/W)|0)-.2,tr_('accidentFx'),'#C0392B');
  sfx('crash'); hint('hAccident',6);
}
const tr_=k=>tr(k);

// =====================================================================
//  SIMULARE
// =====================================================================
function houseCount(c){let n=0;for(const h of G.houses)if(h.color===c)n++;return n;}
function step(dt){
  G.time+=dt;
  computeLocks();
  // cerere
  for(const s of G.shops){
    const hc=houseCount(s.color);
    if(hc>0){
      const rate=(.55+.11*Math.min(hc,8))/Math.max(3.3,8.5-.38*G.week)*G.city.diff*(G.mode==='demo'?.7:1);
      s.pinAcc+=dt*rate;
      if(s.pinAcc>=1){s.pinAcc-=1;if(s.demand<MAXPIN)s.demand++;}
    }
    if(s.demand>=OVER) s.timer+=dt/26; else s.timer=Math.max(0,s.timer-dt/12);
    if(s.timer>=1){ if(G.mode==='demo'){s.timer=0;s.demand=2;} else {gameOver(s);return;} }
    if(s.stock<=3&&!G.trains.length) hint('hSupply',9);
  }
  G.dispT-=dt; if(G.dispT<=0){G.dispT=.3;dispatch();}
  // index segmente
  G.segMap.clear(); G.startMap.clear();
  for(const c of G.cars){
    if(c.dead||c.phase==='park') continue;
    const a=c.path[c.i], k=a*N+c.path[c.i+1];
    let l=G.segMap.get(k); if(!l){l=[];G.segMap.set(k,l);} l.push(c);
    let m=G.startMap.get(a); if(!m){m=[];G.startMap.set(a,m);} m.push(c);
  }
  for(const c of G.cars) if(!c.dead) stepCar(c,dt);
  // trenuri
  G.trainT-=dt;
  if(G.trainT<=0){
    G.trainT=.5;
    for(const d of G.depots){
      if(G.res.loco<=0) break;
      if(G.trains.some(t=>t.depot===d&&t.phase==='idle')) continue;
      const p=findJob(d);
      if(p){ G.res.loco--; const t={id:uid++,depot:d,shop:null,path:null,cum:null,s:0,seg:0,phase:'idle',cargo:0,wait:0,cool:0,held:-1}; G.trains.push(t); startJob(t,p); }
    }
  }
  for(const t of G.trains) stepTrain(t,dt);
  checkAccidents();
  if(G.cars.some(c=>c.dead)) G.cars=G.cars.filter(c=>!c.dead);
  // epave & masini pierdute
  for(let i=0;i<N;i++) if(wreck[i]>0){ wreck[i]-=dt; if(wreck[i]<0) wreck[i]=0; }
  if(G.pending.length){ for(const p of G.pending){p.t-=dt;if(p.t<=0)p.h.home++;} G.pending=G.pending.filter(p=>p.t>0); }
  // aparitii
  G.houseT-=dt;
  if(G.houseT<=0){
    G.houseT=Math.max(3,8-.3*G.week)*rnd(.7,1.3);
    const cap=G.mode==='demo'?G.shops.length*5:G.shops.length*6+2;
    if(G.houses.length<cap) spawnHouse();
  }
  if(G.mode!=='demo'){
    G.shopT-=dt; if(G.shopT<=0){G.shopT=Math.max(40,75-2.5*G.week)*rnd(.85,1.15);spawnShop();}
    G.weekT+=dt; if(G.weekT>=WEEK_LEN) endWeek();
  }
}
function spawnHouse(){

function camTarget(){
  const b=G.bounds, bw=b.x1-b.x0+2, bh=b.y1-b.y0+2;
  const top=vw<640?100:92, bot=vw<640?96:92;
  if(G.capsule){ const q=G.capsule, ts=Math.max(vw/bw,vh/bh)*q.zoom; return {cx:(b.x0+b.x1+1)/2+q.dx*bw,cy:(b.y0+b.y1+1)/2+q.dy*bh,ts,oy:0}; }
  if(G.mode==='demo'){ const ts=Math.min((vw*.9)/bw,(vh*.95)/bh); return {cx:(b.x0+b.x1+1)/2-(vw>900?bw*.18:0),cy:(b.y0+b.y1+1)/2,ts,oy:0}; }
  const ts=Math.min((vw-24)/bw,(vh-top-bot)/bh);
  return {cx:(b.x0+b.x1+1)/2,cy:(b.y0+b.y1+1)/2,ts,oy:(top-bot)/2};
}
function fitCam(now){
  const t=camTarget();
  if(now){Object.assign(cam,t);return;}
  const k=.08;
  for(const q of ['cx','cy','ts','oy']){const d=t[q]-cam[q]; cam[q]=Math.abs(d)<.001?t[q]:cam[q]+d*k;}
}
const ox=()=>vw/2-cam.cx*cam.ts, oy=()=>vh/2+cam.oy-cam.cy*cam.ts;
function s2t(sx,sy){return [(sx-ox())/cam.ts,(sy-oy())/cam.ts];}
function t2s(tx,ty){return [tx*cam.ts+ox(),ty*cam.ts+oy()];}
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  vw=window.innerWidth; vh=window.innerHeight;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  sc.width=cv.width; sc.height=cv.height;
  if(G) fitCam(true);
  staticKey='';
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const pop=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const cxy=t=>[t%W+.5,((t/W)|0)+.5];

function renderStatic(){
  const c=sctx, ts=cam.ts, city=G.city, b=G.bounds;
  c.setTransform(1,0,0,1,0,0); c.fillStyle=FOG; c.fillRect(0,0,sc.width,sc.height);

  // munti

  c.fillStyle='rgba(255,255,255,.55)';
  for(let t=0;t<N;t++) if(mount[t]&&hash(t)<.55){const x=t%W+.5+(hash(t+7)-.5)*.3,y=((t/W)|0)+.55; c.beginPath();c.moveTo(x-.3,y+.22);c.lineTo(x,y-.26);c.lineTo(x+.3,y+.22);c.closePath();c.fillStyle='rgba(120,130,112,.28)';c.fill();c.beginPath();c.moveTo(x-.1,y-.08);c.lineTo(x,y-.26);c.lineTo(x+.1,y-.08);c.closePath();c.fillStyle='rgba(255,255,255,.7)';c.fill();}
  // apa
  c.fillStyle=city.shore; for(let t=0;t<N;t++) if(water[t]){const x=t%W,y=(t/W)|0;c.fillRect(x-.1,y-.1,1.2,1.2);}
  c.fillStyle=city.water; for(let t=0;t<N;t++) if(water[t]){const x=t%W,y=(t/W)|0;c.fillRect(x-.01,y-.01,1.02,1.02);}
  c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=.05; c.lineCap='round'; c.beginPath();
  for(let t=0;t<N;t++) if(water[t]&&hash(t*3)<.18){const x=t%W+.25+hash(t)*.3,y=((t/W)|0)+.3+hash(t+1)*.4;c.moveTo(x,y);c.quadraticCurveTo(x+.12,y-.08,x+.24,y);c.quadraticCurveTo(x+.36,y+.08,x+.48,y);}
  c.stroke();
  // copaci
  for(let t=0;t<N;t++) if(tree[t]&&!bmap[t]){
    const x=t%W,y=(t/W)|0, n=1+Math.floor(hash(t)*3);
    for(let i=0;i<n;i++){const px=x+.25+hash(t*7+i)*.5,py=y+.25+hash(t*11+i)*.5,r=.14+hash(t*13+i)*.1;
      c.fillStyle='rgba(60,70,50,.13)';c.beginPath();c.arc(px+.04,py+.06,r,0,6.283);c.fill();
      c.fillStyle=city.treeC;c.beginPath();c.arc(px,py,r,0,6.283);c.fill();}
  }
  // grila
  if(SAVE.settings.grid){
    c.fillStyle='rgba(34,38,45,.10)'; c.beginPath();
    for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++){const t=idx(x,y);if(water[t]||mount[t]||tree[t]||roadN[t]||railN[t]||bmap[t])continue;c.moveTo(x+.545,y+.5);c.arc(x+.5,y+.5,.045,0,6.283);}
    c.fill();
  }
  c.restore();

  const segs=(E,filter)=>{const out=[];for(let t=0;t<N;t++){const m=E[t];if(!m)continue;for(let d=0;d<4;d++)if(m&(1<<d)){const n=t+DOFF[d];if(!filter||filter(t,n))out.push(t,n);}}return out;};
  const strokeSegs=(s,w,col)=>{c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();for(let i=0;i<s.length;i+=2){const [ax,ay]=cxy(s[i]),[bx,by]=cxy(s[i+1]);c.moveTo(ax,ay);c.lineTo(bx,by);}c.stroke();};
  const dots=(NN,r,col,filter)=>{c.fillStyle=col;c.beginPath();for(let t=0;t<N;t++)if(NN[t]&&(!filter||filter(t))){const [x,y]=cxy(t);c.moveTo(x+r,y);c.arc(x,y,r,0,6.283);}c.fill();};
  const roadS=segs(roadE), railS=segs(railE);
  const wet=(a,b2)=>water[a]||water[b2];
  // poduri
  strokeSegs(segs(roadE,wet),.86,DECK); strokeSegs(segs(railE,wet),.56,DECK);

  for(let i=0;i<railS.length;i+=2){const [ax,ay]=cxy(railS[i]),[bx,by]=cxy(railS[i+1]);tieSeg(ax,ay,bx,by);}
  for(let t=0;t<N;t++) if(railN[t]&&!railE[t]){const [x,y]=cxy(t);tieSeg(x-.3,y,x+.3,y);}
  c.stroke();
  strokeSegs(railS,.13,RAIL);
  dots(railN,.065,RAIL);
  // pasaje
  for(let t=0;t<N;t++){
    if(!(roadN[t]&&railN[t]&&xing[t]===2)) continue;
    const [x,y]=cxy(t);
    const half=[];for(let d=0;d<8;d++)if(roadE[t]&(1<<d))half.push([x+DX[d]*.5,y+DY[d]*.5]);
    const draw=(w,col,r)=>{c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();for(const [px,py] of half){c.moveTo(x,y);c.lineTo(px,py);}c.stroke();c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();};
    c.fillStyle='rgba(40,44,40,.18)'; c.beginPath(); c.arc(x+.06,y+.1,.46,0,6.283); c.fill();
    draw(.84,DECK,.42); draw(.56,ROAD,.28);
  }
}

function render(rdt){

  for(const d of G.depots) drawShadow(d,1.72);

function drawShop(s){

function drawTrain(tr){
  const parts=tr.phase==='unload'?[]:TRAIN_PARTS, total=tr.cum[tr.cum.length-1];
  for(let i=parts.length-1;i>=0;i--){

      ctx.fillStyle='#F4D35E'; ctx.beginPath(); ctx.arc(.26,-.08,.04,0,6.283); ctx.arc(.26,.08,.04,0,6.283); ctx.fill();
    } else {
      const loaded=tr.phase==='go';
      ctx.fillStyle=loaded?CRATE:'#A7ACB2'; rr(ctx,-.3,-.155,.6,.31,.06); ctx.fill();
      ctx.strokeStyle=loaded?CRATE_D:'#80858C'; ctx.lineWidth=.035;
      if(loaded){ctx.beginPath();ctx.moveTo(-.02,-.15);ctx.lineTo(-.02,.15);ctx.moveTo(-.3,0);ctx.lineTo(.3,0);ctx.stroke();}
    }
    ctx.restore();
  }
}
function drawCrossings(rdt){
  const blink=Math.floor(G.time*4)%2===0;
  for(let t=0;t<N;t++){
    if(!(roadN[t]&&railN[t])) continue;
    const x=xing[t], [px,py]=cxy(t);
    if(x===2) continue;
    if(x===0){
      // semn de pericol
      ctx.save(); ctx.translate(px+.36,py-.36);
      ctx.fillStyle='#F2C230'; ctx.beginPath(); ctx.moveTo(0,-.17); ctx.lineTo(.17,0); ctx.lineTo(0,.17); ctx.lineTo(-.17,0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=.04; ctx.beginPath(); ctx.moveTo(-.06,-.06); ctx.lineTo(.06,.06); ctx.moveTo(.06,-.06); ctx.lineTo(-.06,.06); ctx.stroke();
      ctx.restore();
      continue;
    }
    const locked=G.lock.has(t);
    barAnim[t]+=((locked?1:0)-barAnim[t])*Math.min(1,rdt*7);
    let rd=0; for(let d=0;d<8;d++) if(railE[t]&(1<<d)){rd=d;break;}
    const a=barAnim[t];
    ctx.save(); ctx.translate(px,py); ctx.rotate(rd*Math.PI/4);
    for(const sgn of [-1,1]){
      const yy=sgn*.37, x0=sgn*.36, len=.12+.56*a;
      ctx.lineCap='round';
      ctx.strokeStyle='#fff'; ctx.lineWidth=.1; ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x0-sgn*len,yy); ctx.stroke();
      ctx.strokeStyle='#E8604C'; ctx.lineCap='butt'; ctx.setLineDash([.09,.09]); ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x0-sgn*len,yy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(x0,yy,.07,0,6.283); ctx.fill();
      if(locked){ctx.fillStyle=blink?'#FF4A33':'#7A2E26';ctx.beginPath();ctx.arc(x0,yy,.04,0,6.283);ctx.fill();}
    }
    ctx.restore();
  }
}
function drawWrecks(){
  for(let t=0;t<N;t++){
    if(wreck[t]<=0) continue;
    const [x,y]=cxy(t), f=wreck[t]/9;
    for(let i=0;i<3;i++){const ph=(G.time*.8+i/3)%1;ctx.fillStyle='rgba(90,94,100,'+(.35*(1-ph))+')';ctx.beginPath();ctx.arc(x+(i-1)*.14,y-.2-ph*.5,.1+ph*.18,0,6.283);ctx.fill();}
    ctx.fillStyle='#F28C28'; ctx.beginPath();
    for(let i=0;i<10;i++){const r=i%2?.14:.3,a=i*Math.PI/5+G.time*.5;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#E8604C'; ctx.beginPath(); ctx.arc(x,y,.1,0,6.283); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=.06; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(x,y,.45,-Math.PI/2,-Math.PI/2+6.283*f); ctx.stroke();
  }
}
let hover=null, hoverF=null;
function drawCursor(){
  if(!hover||G.mode!=='play'||G.over||G.modal) return;
  const [x,y]=hover; if(!inB(x,y)) return;
  const t=idx(x,y), tool=G.tool;
  if(tool==='barrier'||tool==='overpass'){
    const pulse=.3+.1*Math.sin(G.time*6);
    for(let q=0;q<N;q++) if(roadN[q]&&railN[q]&&(tool==='overpass'?xing[q]!==2:xing[q]===0)){const [px,py]=cxy(q);ctx.strokeStyle='rgba(34,38,45,.55)';ctx.lineWidth=.05;ctx.beginPath();ctx.arc(px,py,.5+pulse*.2,0,6.283);ctx.stroke();}
  }
  const bad=bmap[t]||mount[t];
  ctx.strokeStyle=bad?'rgba(216,69,47,.8)':tool==='erase'?'#D8452F':'rgba(34,38,45,.7)';
  ctx.lineWidth=.06; ctx.beginPath(); ctx.arc(x+.5,y+.5,.42,0,6.283); ctx.stroke();
}

function fx(x,y,text,color){ if(G.fx.length<40) G.fx.push({x,y,text,color,t:0}); }

// =====================================================================
//  AUDIO (efecte + muzica generativa)
// =====================================================================
let AC=null, sfxGain=null, musGain=null, musTimer=null, lastBuild=0;
function initAudio(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); sfxGain=AC.createGain(); musGain=AC.createGain(); sfxGain.connect(AC.destination); musGain.connect(AC.destination); applyVolumes(); startMusic(); }
    if(AC.state==='suspended') AC.resume();
  }catch(e){AC=null;}
}
function applyVolumes(){ if(!AC) return; sfxGain.gain.value=(SAVE.settings.sfx/100)**1.5; musGain.gain.value=(SAVE.settings.music/100)**1.5*.8; }
function tone(f,dur,type,vol,delay,dest){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(dest||sfxGain); o.start(t0); o.stop(t0+dur+.05);
}
function noise(dur,vol){
  if(!AC) return;
  const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=buf; f.type='lowpass'; f.frequency.value=900; g.gain.value=vol;
  s.connect(f).connect(g).connect(sfxGain); s.start();
}
const NOTES=[523.25,587.33,659.25,783.99,880];
function sfx(k,a){
  if(!AC||G.mode!=='play') return;
  switch(k){
    case 'deliver': tone(NOTES[a%5],.4,'sine',.06); tone(NOTES[a%5]*2,.25,'sine',.015,.02); break;
    case 'build': {const n=performance.now(); if(n-lastBuild>40){lastBuild=n; tone(380+Math.random()*60,.05,'triangle',.035);} break;}
    case 'erase': tone(200,.08,'triangle',.04); break;
    case 'place': tone(440,.08,'triangle',.05); tone(660,.12,'triangle',.04,.06); break;
    case 'horn': tone(196,.28,'square',.012); tone(247,.28,'square',.012,.03); break;
    case 'goods': tone(330,.12,'triangle',.05); tone(494,.2,'triangle',.05,.08); break;
    case 'spawn': tone(700,.12,'sine',.025); break;
    case 'crash': noise(.7,.5); tone(90,.5,'sawtooth',.05); break;
    case 'fail': tone(300,.6,'sawtooth',.03); tone(200,.8,'sawtooth',.03,.25); break;
    case 'week': [523,659,784].forEach((f,i)=>tone(f,.35,'sine',.05,i*.1)); break;
  }
}
const CHORDS=[[261.63,329.63,392.0,493.88],[220.0,261.63,329.63,392.0],[174.61,220.0,261.63,329.63],[196.0,246.94,293.66,392.0]];
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
function startMusic(){
  let next=AC.currentTime+.3, ci=0;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100; lp.connect(musGain);
  musTimer=setInterval(()=>{
    if(!AC||AC.state!=='running') return;
    while(next<AC.currentTime+2){
      for(const f of CHORDS[ci%4]){
        const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f/2; o.detune.value=(Math.random()-.5)*8;
        g.gain.setValueAtTime(0,next); g.gain.linearRampToValueAtTime(.022,next+1.6); g.gain.linearRampToValueAtTime(.016,next+4); g.gain.linearRampToValueAtTime(0,next+6);
        o.connect(g).connect(lp); o.start(next); o.stop(next+6.2);
      }
      for(let j=0;j<4;j++) if(Math.random()<.5) tone(pick(PENTA),1.4,'sine',.018,next-AC.currentTime+j*1.2+Math.random()*.3,lp);
      next+=4.8; ci++;
    }
  },400);
}

// =====================================================================
//  CONTROL
// =====================================================================
let drag=null;
function ptrTile(e){const r=cv.getBoundingClientRect();const [fx_,fy_]=s2t(e.clientX-r.left,e.clientY-r.top);return [fx_,fy_];}
function canPlay(){return G&&G.mode==='play'&&!G.over&&!G.modal&&$('scrPause').hidden;}
cv.addEventListener('pointerdown',e=>{
  if(!canPlay()) return;
  const [fx_,fy_]=ptrTile(e), x=Math.floor(fx_), y=Math.floor(fy_);
  if(!inGrid(x,y)) return;
  const t=idx(x,y);
  const erase=e.button===2||G.tool==='erase';
  if(!erase&&(G.tool==='barrier'||G.tool==='overpass')){ applySpecial(t,G.tool); updateHud(); return; }
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  drag={erase,kind:G.tool==='rail'?'rail':'road',last:-1};
  registerTile(t);
  updateHud();
});
cv.addEventListener('pointermove',e=>{
  const [fx_,fy_]=ptrTile(e), x=Math.floor(fx_), y=Math.floor(fy_);
  hover=[x,y];
  if(!drag||!inGrid(x,y)) return;
  const t=idx(x,y);
  if(t===drag.last) return;
  const near=Math.hypot(fx_-x-.5,fy_-y-.5)<.44;
  const adj=drag.last>=0&&dirIdx(drag.last,t)>=0;
  if(near||!adj||drag.last<0) registerTile(t);
  updateHud();
});
const endDrag=()=>{drag=null;};
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',()=>{hover=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function registerTile(t){
  if(drag.erase){
    if(drag.last>=0) stepLine(drag.last,t,(a,b)=>{eraseTile(b);return true;});
    eraseTile(t); drag.last=t; return;
  }
  const kind=drag.kind, NN=kind==='road'?roadN:railN;
  if(drag.last<0){
    if(bmap[t]) return;
    if(NN[t]||placeNode(t,kind,false)) drag.last=t;
    return;
  }
  stepLine(drag.last,t,(a,b)=>{ if(connect(a,b,kind,false)){drag.last=b;return true;} return false; });
}
function stepLine(from,to,fn){
  let cx=from%W, cy=(from/W)|0; const tx=to%W, ty=(to/W)|0; let guard=80;
  while((cx!==tx||cy!==ty)&&guard--){
    const nx=cx+Math.sign(tx-cx), ny=cy+Math.sign(ty-cy);
    if(!fn(idx(cx,cy),idx(nx,ny))) return;
    cx=nx; cy=ny;
  }
}
function setTool(t){ G.tool=t; for(const b of document.querySelectorAll('.tool')) b.classList.toggle('on',b.dataset.tool===t); }
for(const b of document.querySelectorAll('.tool')) b.addEventListener('click',()=>{ if(G&&G.mode==='play') setTool(b.dataset.tool); });
function setSpeed(sp){
  if(!G||G.mode!=='play'||G.over) return;
  if(sp===0) G.paused=true; else {G.paused=false;G.speed=sp;}
  for(const b of document.querySelectorAll('#speedCtl button')) b.classList.toggle('on',(+b.dataset.sp)===(G.paused?0:G.speed));
}
for(const b of document.querySelectorAll('#speedCtl button')) b.addEventListener('click',()=>setSpeed(+b.dataset.sp));
window.addEventListener('keydown',e=>{
  if(!G||G.mode!=='play') return;
  if(e.key==='Escape'){ e.preventDefault(); if(!$('scrPause').hidden) resume(); else if(!$('scrSettings').hidden||!$('scrHow').hidden) show('scrPause'); else if(!G.over&&!G.modal) openPause(); return; }
  if(!canPlay()) return;
  const tools={'1':'road','2':'rail','3':'barrier','4':'overpass','5':'erase'};
  if(tools[e.key]) setTool(tools[e.key]);
  else if(e.code==='Space'){ e.preventDefault(); setSpeed(G.paused?G.speed:0); }
  else if(e.key==='f'||e.key==='F'){ setSpeed(G.paused?G.speed:(G.speed%3)+1); }
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(canPlay()) setSpeed(0); if(AC) AC.suspend(); }
  else if(AC) AC.resume();
});

function buildCityGrid(){
  const grid=$('cityGrid'); grid.innerHTML='';
  const wat=new Uint8Array(N), mnt=new Uint8Array(N), tre=new Uint8Array(N);
  CITIES.forEach((c,i)=>{
    const ok=unlocked(i);
    const btn=document.createElement('button'); btn.className='cityCard'; btn.disabled=!ok;
    const cvs=document.createElement('canvas'); cvs.width=240; cvs.height=150;
    genTerrain(c,wat,mnt,tre);
    const g=cvs.getContext('2d'), s=5;
    g.fillStyle=c.land; g.fillRect(0,0,240,150);
    for(let t=0;t<N;t++){const x=t%W,y=(t/W)|0; if(wat[t]){g.fillStyle=c.water;g.fillRect(x*s,y*s,s,s);} else if(mnt[t]){g.fillStyle=c.mount;g.fillRect(x*s,y*s,s,s);} else if(tre[t]){g.fillStyle=c.treeC;g.beginPath();g.arc(x*s+2.5,y*s+2.5,2,0,6.283);g.fill();}}
    const col=COLORS[i%5]; g.fillStyle=col.c; g.fillRect(116,70,10,10);
    const info=document.createElement('div'); info.className='info';

    btn.append(cvs,info);
    btn.onclick=()=>startCity(i);

  });
}

// =====================================================================
//  BUCLA
// =====================================================================
let acc=0, lastT=performance.now();
function frame(now){
  const rdt=Math.min(.1,(now-lastT)/1000); lastT=now;
  const running=G.mode==='demo'?true:(G.mode==='play'&&!G.over&&!G.paused&&!G.modal&&$('scrPause').hidden&&$('scrSettings').hidden&&$('scrHow').hidden);
  if(running){
    acc+=rdt*(G.mode==='demo'?1:G.speed); let n=0;
    while(acc>=STEP&&n<10){ step(STEP); acc-=STEP; n++; if(G.over||G.modal){acc=0;break;} }
    if(n>=10) acc=0;
    if(G.mode==='play') updateHud();
  }
  for(const f of G.fx) f.t+=rdt*1.1; if(G.fx.length) G.fx=G.fx.filter(f=>f.t<1);
  if(toastT>0){ toastT-=rdt; if(toastT<=0) $('toast').classList.remove('show'); }
  fitCam(false);
  render(rdt);
  requestAnimationFrame(frame);
}

window.addEventListener('resize',resize);
resize();
toMenu();
applyLang();
window.__TJ={get G(){return G;},fitCam,startCity,step,connect,eraseTile,applySpecial,autoConnect,doorTiles,idx,dijkstra,roadN,railN,roadE,railE,xing,wreck,W,H,N,setSpeed,endWeek};
requestAnimationFrame(frame);
})();
